plugins {
    id 'com.android.application'
}

// Broj verzije iz version.properties (može da se zameni sa -PversionCode / -PversionName).
def ver = new Properties()
rootProject.file('version.properties').withInputStream { ver.load(it) }
def ciVersionCode = (project.findProperty('versionCode') ?: ver['versionCode']) as Integer
def ciVersionName = (project.findProperty('versionName') ?: ver['versionName']) as String

// AdMob ID-jevi iz admob.properties (podrazumevano Google-ovi test ID-jevi).
def admob = new Properties()
rootProject.file('admob.properties').withInputStream { admob.load(it) }
def ks = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'rs.vojinvukasin.tvrdjava'
    compileSdk 36

    defaultConfig {
        applicationId 'rs.vojinvukasin.tvrdjava'
        minSdk 24
        targetSdk 36
        versionCode ciVersionCode
        versionName ciVersionName
        manifestPlaceholders = [admobAppId: admob['appId']]
        buildConfigField 'String', 'ADMOB_BANNER_ID', "\"${admob['bannerId']}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Stalni test ključ (u repozitorijumu) da bi nove verzije mogle da se instaliraju preko starih.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Bez sopstvenog ključa u GitHub tajnama koristi se stalni test ključ iz repozitorijuma.
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google Mobile Ads (AdMob) za reklamni baner.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    // Reklamni paket uvlači stare androidx.activity 1.0.0 i fragment 1.1.0,
    // koje Google Play prijavljuje kao zastarele. Ovde se traže nove verzije.
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.6'
}
