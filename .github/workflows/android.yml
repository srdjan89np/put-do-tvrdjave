name: Android APK

# Na svaki push na main pravi se novi APK i objavljuje u "Releases".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Kopiraj igricu u aplikaciju
        run: |
          ASSETS=android/app/src/main/assets
          mkdir -p "$ASSETS"
          cp index.html icon.png "$ASSETS/"
          bash scripts/fetch-fonts.sh "$ASSETS/fonts"

      - name: Pripremi ključ za potpis (ako postoji)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Nema ključa u tajnama, APK se potpisuje debug ključem."
          fi

      - name: Napravi APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../put-do-tvrdjave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: put-do-tvrdjave-apk
          path: put-do-tvrdjave.apk

      - name: Objavi u Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Пут до тврђаве 1.0.${{ github.run_number }}
          body: |
            Android APK igrice „Пут до Краљеве тврђаве“.
            Preuzmi `put-do-tvrdjave.apk` i instaliraj ga na telefon.
          files: put-do-tvrdjave.apk
          make_latest: true
