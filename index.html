<title>Пут до Краљеве тврђаве</title>

<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font-size:14px}
img{max-width:100%}

<style>
/* Layout: one-screen arcade cabinet — score strip on top, game screen in the middle, thumb pad at the bottom */
:root{
  --bg:#131833; --panel:#1e2548; --panel-2:#283163; --ink:#f5f2ff; --muted:#a7aedb;
  --vojin:#3a6ee8; --vuk:#4cd06e; --gold:#ffc62b;
  --display:'Rubik','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px}

/* HUD */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch;min-height:66px}
.pls{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:6px;min-width:0}
.pl{min-width:0;display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:12px;background:var(--panel);border:2px solid transparent;opacity:.7;transition:opacity .2s,border-color .2s}
.pl.on{opacity:1;border-color:var(--c)}
.pl.out{opacity:.4}
.pl .top{display:flex;align-items:baseline;gap:6px;min-width:0}
.pl b{font-family:var(--display);font-weight:800;font-size:18px;color:var(--c);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .hearts{color:#ff5a7a;font-size:13px;letter-spacing:1px;white-space:nowrap}
.pl .stats{display:flex;gap:10px;font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.pl .stats span:first-child{color:var(--ink)}
.pl .coin{color:var(--gold)}
/* 3-4 igrača: zbijenija polja (ime / srca + poeni / nivo) */
.pls.many{gap:4px}
.pls.many .pl{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n n" "h s" "l l";column-gap:4px;row-gap:1px;padding:4px 5px;align-items:baseline}
.pls.many .pl .top,.pls.many .pl .stats{display:contents}
.pls.many .pl b{grid-area:n;font-size:12px;letter-spacing:0}
.pls.many .pl .hearts{grid-area:h;font-size:10px;letter-spacing:0}
.pls.many .pl .sc{grid-area:s;font-size:11px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.pls.many .pl .lv{grid-area:l;font-size:10px;color:var(--muted);font-weight:800}
.pls.many .pl .coin{display:none}
.opt{position:relative}
.opt.sel{border-color:var(--c);background:var(--panel-2)}
.opt .badge{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2a1d00;font:800 13px/22px var(--display);text-align:center}
.mid{display:flex;flex-direction:column;gap:6px;justify-content:center}
.mid button{width:36px;height:30px;border-radius:9px;border:0;background:var(--panel-2);color:var(--ink);font:900 14px var(--body);cursor:pointer}
.mid button:focus-visible,.pad button:focus-visible,.card button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#btnSound.off{color:var(--muted);text-decoration:line-through}

/* Stage */
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center}
#c{display:block;border-radius:14px;box-shadow:0 0 0 3px #0b0f24,0 10px 30px rgba(0,0,0,.45);touch-action:none}

/* Overlay card */
.card{position:absolute;inset:auto;max-width:min(92%,440px);background:rgba(19,24,51,.94);border:3px solid #0b0f24;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.kicker{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,38px);line-height:1.05;text-wrap:balance;color:var(--hc,var(--ink))}
.card .info{margin:0;font-size:15px;font-weight:700;line-height:1.45;max-width:36ch;color:var(--ink)}
.card .hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.pors{display:flex;gap:14px;justify-content:center}
.pors canvas{width:56px;height:64px}
.rows{display:grid;gap:6px;width:100%}
.rows .r{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.rows .r b{font-family:var(--display);font-weight:800;font-size:18px;color:var(--c);text-align:left}
.rows .r span{color:var(--muted);font-size:13px;text-align:left}
.rows .r em{font-style:normal;font-size:18px}
.card button.go{margin-top:4px;border:0;border-radius:14px;padding:12px 30px;background:var(--gold);color:#2a1d00;font:800 22px var(--display);letter-spacing:.5px;cursor:pointer;box-shadow:0 4px 0 #b58300}
.card button.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b58300}
.card{max-height:calc(100% - 12px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.card>*{flex-shrink:0}
.card{z-index:5;background:#151b38}
.acts{position:sticky;bottom:-18px;margin:0 -20px -18px;padding:8px 20px 12px;width:calc(100% + 40px);display:flex;flex-direction:column;align-items:center;gap:2px;background:#151b38;border-radius:0 0 15px 15px;box-shadow:0 -10px 14px -6px #151b38;z-index:1}
.acts:has(> :not([hidden])){}
.acts .go:not([hidden])+.alt{margin-top:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:14px;border:3px solid var(--panel-2);background:var(--panel);color:var(--ink);cursor:pointer;font-family:var(--body);min-width:0}
.opt:hover,.opt:focus-visible{border-color:var(--c,var(--gold));outline:none;background:var(--panel-2)}
.opt b{font:800 22px var(--display);color:var(--c,var(--ink))}
.opt small{font-size:12px;color:var(--muted);font-weight:800;line-height:1.3}
.opt canvas{width:48px;height:55px}
.alt{background:none;border:0;color:var(--muted);font:800 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 8px}
.alt:focus-visible{outline:3px solid var(--gold);border-radius:6px}
.pl.gone{visibility:hidden}
.hs{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:4px}
.hs li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel);border-radius:9px;padding:6px 10px;font-weight:800;font-variant-numeric:tabular-nums;text-align:left;border:2px solid transparent}
.hs li .rk{color:var(--muted);font-size:14px}
.hs li:nth-child(1) .rk{color:var(--gold)}
.hs li .nm{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.hs li .nm b{font-family:var(--display);font-weight:800;font-size:16px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs li .nm small{color:var(--muted);font-size:11px;font-weight:800}
.hs li .sc{font-size:17px}
.hs li.new{border-color:var(--gold);background:var(--panel-2)}
.acts:not(:has(:not([hidden]))){display:none}
.stars{display:flex;gap:6px;justify-content:center;font-size:42px;line-height:1;color:var(--gold);text-shadow:0 3px 0 #b58300}
.stars span{animation:starIn .45s cubic-bezier(.2,1.6,.4,1) both}
.stars span.off{color:#343b68;text-shadow:none}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.links button{border:2px solid var(--panel-2);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 14px;font:800 14px var(--body);cursor:pointer}
.links button:hover,.links button:focus-visible{border-color:var(--gold);outline:none}
.links button:first-child{color:var(--gold)}
.hs-title{margin:2px 0 -2px;font-size:12px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}

/* Touch pad */
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:none}
.pad .dirs{display:flex;gap:10px}
.pad button{touch-action:none;border:0;border-radius:18px;background:var(--panel-2);color:var(--ink);font:800 26px var(--display);width:76px;height:64px;box-shadow:0 4px 0 #0b0f24}
.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 #0b0f24;background:#3a4585}
.pad .jump{width:120px;background:var(--gold);color:#2a1d00;box-shadow:0 4px 0 #b58300;font-size:24px}
.pad .jump.on{background:#ffd75e;box-shadow:0 1px 0 #b58300}
.pad .shoot{width:88px;font-size:18px;background:#7a4a2a;color:#ffe9cf;box-shadow:0 4px 0 #4a2a14}
.pad .shoot.on{background:#9a6038;box-shadow:0 1px 0 #4a2a14}
.pad .shoot.dim{opacity:.35}
.pad .shoot{padding:0;white-space:nowrap;letter-spacing:0}
.pad .shoot.sword{background:#4a5a7a;color:#eef3ff;box-shadow:0 4px 0 #2a3450;font-size:15px}
.pad .shoot.sword.on{background:#5d6f94;box-shadow:0 1px 0 #2a3450}
.pl .wp{color:#ffb36b}
@media (max-width:400px){.pad button{width:58px}.pad .jump{width:82px;font-size:20px;padding:0}.pad .shoot{width:88px;font-size:14px}.pad .shoot.sword{font-size:13px}}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media (max-height:520px) and (orientation:landscape){
  #app{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);gap:0 10px;padding-block:6px;padding-inline:max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px));max-width:none}
  #stage{grid-row:1;grid-column:2;height:100%}
  .hud{grid-row:1;grid-column:2;align-self:start;margin:4px 6px 0;z-index:3;pointer-events:none;grid-template-columns:minmax(0,1fr) auto;min-height:0}
  .pls{grid-template-columns:repeat(var(--n,2),minmax(0,150px))}
  .hud .mid{flex-direction:row;align-items:flex-start;justify-content:center}
  .hud .mid button{pointer-events:auto;opacity:.85}
  .pl{padding:2px 8px;background:rgba(21,27,56,.85)}
  .opts .opt{padding-right:38px}
  .opts .opt .badge{top:50%;margin-top:-11px;right:8px}
  .pl b{font-size:14px}.pl .stats{font-size:11px}
  #c{border-radius:0;box-shadow:none}
  .card{padding:10px 16px;gap:6px;max-height:calc(100% - 10px);max-width:min(94%,560px)}
  .acts{bottom:-10px;margin:0 -16px -10px;padding:6px 16px 8px;width:calc(100% + 32px)}
  .card h2{font-size:24px}
  .card .info{font-size:13px;line-height:1.35;max-width:52ch}
  .pors canvas{width:38px;height:44px}
  .opt{padding:6px 8px;flex-direction:row;justify-content:center;gap:8px;text-align:left}
  .opt canvas{width:34px;height:39px}
  .opt b{font-size:18px}
  .opts{gap:8px}
  .card button.go{padding:8px 26px;font-size:19px}
  .hs{grid-template-columns:1fr 1fr;gap:4px 8px}
  .hs li{padding:4px 8px}
  .stars{font-size:28px}
  .links button{padding:4px 12px;font-size:13px}
  .modal .pad{visibility:hidden}
  .pad{display:contents}
  .pad .dirs{grid-row:1;align-self:end;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding-bottom:6px}
  .pad .dirs:first-child{grid-column:1;flex-direction:row;align-items:flex-end}
  .pad .dirs:last-child{grid-column:3}
  .pad button{height:58px;width:62px}
  .pad .jump{width:100px;height:70px}
  .pad .shoot{width:100px;height:48px;font-size:16px}
  .pad .shoot.sword{font-size:15px}
}
@media (hover:hover) and (pointer:fine){.pad,.pad .dirs{display:none!important}}
@media (prefers-reduced-motion:reduce){.pl{transition:none}.stars span{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="pls" id="hudP"></div>
    <div class="mid">
      <button id="btnPause" aria-label="Пауза" hidden>❚❚</button>
      <button id="btnSound" aria-label="Звук">♪</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="c"></canvas>
    <div class="card" id="card" hidden>
      <div class="kicker" id="cKick"></div>
      <div class="pors" id="cPors"></div>
      <h2 id="cTitle"></h2>
      <div class="stars" id="cStars" hidden></div>
      <p class="info" id="cInfo"></p>
      <div class="rows" id="cRows"></div>
      <p class="hs-title" id="cHsT" hidden></p>
      <ol class="hs" id="cHs" hidden></ol>
      <div class="opts" id="cOpts"></div>
      <p class="hint" id="cHint"></p>
      <div class="links" id="cLinks" hidden></div>
      <div class="acts">
        <button class="go" id="cGo">Крени!</button>
        <button class="alt" id="cAlt" hidden></button>
      </div>
    </div>
  </div>

  <div class="pad" id="pad">
    <div class="dirs">
      <button data-k="l" aria-label="Лево">◀</button>
      <button data-k="r" aria-label="Десно">▶</button>
    </div>
    <div class="dirs">
      <button data-k="s" class="shoot" id="btnShoot" aria-label="Ударај">УДАРАЈ</button>
      <button data-k="j" class="jump" aria-label="Скок">СКОК</button>
    </div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const T=32,ROWS=14,H=ROWS*T;
const GRAV=0.55,JUMP=-13.6,MAXV=4.2,SPRING=-19;
const AIR=0,TOP=1,DIRT=2,BRICK=3,CRATE=4,USED=5,SPIKE=6,LAVA=7,SPR=8,STONE=9,CLOUD=10,CRACK=11;
const SOLID=[0,1,1,1,1,1,0,0,1,1,1,1];

const THEMES={
  dan:{sky:['#f7c59f','#fde4c3'],top:'#6fae3c',topD:'#4f8a2a',dirt:'#8c7b6b',dirtD:'#a39382',far:'#c9a6c7',near:'#8fbf7a',stone:'#9b96a3',stoneHi:'#c3bfca',stoneLo:'#6b6672',house:'#f3d9a4',roof:'#c8452f'},
  pecina:{sky:['#120e22','#2a2044'],top:'#7d6aa8',topD:'#4f4176',dirt:'#3a2f58',dirtD:'#2a2142',far:'#211a3a',near:'#2d2450',stone:'#6b5b8f',stoneHi:'#9584bd',stoneLo:'#43386a',house:'#8a7bb3',roof:'#3cc6d8'},
  nebo:{sky:['#ffb5c8','#c7d3ff'],top:'#ffffff',topD:'#b9a6e8',dirt:'#cdbdf2',dirtD:'#b29fe4',far:'#ffe0ea',near:'#ffffff',stone:'#c9cdee',stoneHi:'#ffffff',stoneLo:'#9fa6d6',house:'#ffffff',roof:'#ff7aa2'},
  tvrdjava:{sky:['#2a1233','#c4532f'],top:'#7c6f78',topD:'#544a52',dirt:'#4a3f47',dirtD:'#362d34',far:'#4d1f35',near:'#2a1324',stone:'#857880',stoneHi:'#ab9fa6',stoneLo:'#55494f',house:'#6d5f66',roof:'#ff9b2e'},
  pustinja:{sky:['#ffa957','#ffe8b4'],top:'#f2c66d',topD:'#cf9a3c',dirt:'#e0a854',dirtD:'#b9813a',far:'#f3c47e',near:'#e6aa5c',stone:'#d9a35e',stoneHi:'#f5cb8c',stoneLo:'#a8733a',house:'#f6deae',roof:'#2f9c9c'},
  zima:{sky:['#86b2e6','#e8f3ff'],top:'#ffffff',topD:'#c4d8f0',dirt:'#7f9bbd',dirtD:'#62809f',far:'#c7d9f2',near:'#eef5ff',stone:'#a6c6ea',stoneHi:'#e8f4ff',stoneLo:'#7395bf',house:'#e6cfa8',roof:'#4a6fa5'},
  noc:{sky:['#0b1230','#2a3a6e'],top:'#3f9a5c',topD:'#27643d',dirt:'#4a3a30',dirtD:'#33271f',far:'#1b2a52',near:'#121d3c',stone:'#5d6789',stoneHi:'#8a94b8',stoneLo:'#3c4463',house:'#c9a26b',roof:'#8a4fd0'}
};

const HEROES=[
  {name:'Vojin',voc:'Vojine',jacket:'#3a6ee8',jacketD:'#2449a8',hat:'#ffc62b',hatD:'#d99a00',hatStyle:'beanie',hair:'#15110f'},
  {name:'Vukašin',voc:'Vukašine',jacket:'#2fa84f',jacketD:'#1d7a37',hat:'#ff8a3a',hatD:'#c9541c',hatStyle:'cap',hair:'#15110f'},
  {name:'Sanja',voc:'Sanja',acc:'Sanju',f:true,girl:true,jacket:'#b04fd6',jacketD:'#7d2fa0',hat:'#ff7ab8',hatD:'#d4508f',hair:'#6b3a1e'},
  {name:'Srđan',voc:'Srđane',acc:'Srđana',beard:true,big:true,jacket:'#d0413f',jacketD:'#8a2222',hat:'#e9ecf2',hatD:'#b8bdc8',hair:'#2a1c14'}
];
HEROES[0].acc='Vojina';HEROES[1].acc='Vukašina';
// muški/ženski oblik reči: gw(c,'izgubio','izgubila')
function gw(c,m,f){return c&&c.f?f:m;}

/* ---------- Jezik, kasica i kostimi (čuvaju se na uređaju) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let lang=store.get('ptv-jezik','sr')==='en'?'en':'sr';
// tr('srpski latinicom','English'): srpski se na ekranu prikazuje ćirilicom
const tr=(s,e)=>lang==='en'?e:s;
let bank=Math.max(0,store.get('ptv-kasica',0)|0);
function addBank(n){bank=Math.max(0,bank+n);store.set('ptv-kasica',bank);}
const COSTUMES=[
  {id:'pirat',slot:'hat',sr:'Gusarski šešir',en:'Pirate hat',price:150},
  {id:'stit',slot:'shield',sr:'Štit sa lavom',en:'Lion shield',price:250},
  {id:'kruna',slot:'hat',sr:'Kruna',en:'Crown',price:400},
  {id:'plast',slot:'cape',sr:'Zlatni plašt',en:'Golden cape',price:600}
];
let owned=store.get('ptv-kostimi-kupljeni',[]);if(!Array.isArray(owned))owned=[];
{const wear=store.get('ptv-kostimi',{})||{};
 HEROES.forEach((c,i)=>{const w=wear[i]||{};c.cos={hat:owned.includes(w.hat)?w.hat:'',shield:!!w.shield&&owned.includes('stit'),cape:!!w.cape&&owned.includes('plast')};});}
function saveWear(){const o={};HEROES.forEach((c,i)=>o[i]=c.cos);store.set('ptv-kostimi',o);}

/* ---------- Levels ---------- */
const LEVELS=[
{name:'Zelena livada',en:'Green Meadow',wp:[44,7],theme:'dan',w:180,cp:88,goal:172,make(a){
  a.ground(0,15);a.ground(19,30);a.ground(34,60);a.ground(64,100);a.ground(105,140);a.ground(144,179);
  a.deco('tent',1);a.deco('fire',4);a.deco('sign',6);
  a.stairs(8,2,1);a.stairs(10,2,-1);a.row(8,8,'oooo');
  a.deco('tree',13);a.deco('water',16,3);a.mover(15,12,5,0,0,1);a.row(16,10,'ooo');
  a.fill(22,22,11,11,STONE);a.fill(25,25,10,11,STONE);a.row(22,9,'o');a.row(25,8,'o');
  a.deco('bush',20);a.deco('tree',27);a.en('buba',29);

  gap(x+27,x+29);a.row(x+28,9,step);

const POWS=['magnet','nevid','dupli'],POWCOL={magnet:'#ff6b6b',nevid:'#9fd3ff',dupli:'#ffe27a'};
function mkEnemy(type,tx,ty){
  const d={buba:[24,20,-0.9],jez:[26,20,-0.6],ptica:[26,18,0]}[type];
  const e={type,w:d[0],h:d[1],vx:d[2],vy:0,x:tx*T+(T-d[0])/2,y:(ty+1)*T-d[1],active:false,dead:false,deadT:0,t:0,face:-1,ground:false};
  if(type==='ptica'){e.bx=e.x;e.by=ty*T+6;e.amp=T*2.5;e.y=e.by;}
  return e;
}
function build(def){
  const L={name:def.name,theme:def.theme,w:def.w,g:Array.from({length:ROWS},()=>new Array(def.w).fill(AIR)),
    en:def.en,enemies:[],coins:[],items:[],pows:[],fire:[],boss:null,shots:[],deco:[],movers:[],saws:[],bumps:[],springs:{},cp:def.cp,goal:def.goal,t:0};
  const set=(x,y,t)=>{if(x>=0&&x<L.w&&y>=0&&y<ROWS)L.g[y][x]=t;};
  const MAP={B:BRICK,K:CRATE,S:STONE,C:CLOUD,'^':SPIKE,J:SPR};
  const a={
    ground(x1,x2,top=12,mat=TOP){for(let x=x1;x<=x2;x++){set(x,top,mat);for(let y=top+1;y<ROWS;y++)set(x,y,DIRT);}},
    lava(x1,x2){for(let x=x1;x<=x2;x++){set(x,12,LAVA);set(x,13,LAVA);}},
    fill(x1,x2,y1,y2,mat){for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)set(x,y,mat);},
    row(x,y,s){[...s].forEach((ch,i)=>{if(ch==='o')L.coins.push({x:(x+i)*T+T/2,y:y*T+T/2,got:false,k:'c'+(x+i)+','+y});else if(ch==='W')L.items.push({x:(x+i)*T+T/2,y:y*T+T/2,got:false});else if(MAP[ch]!==undefined)set(x+i,y,MAP[ch]);});},
    stairs(x,n,dir=1,mat=STONE){for(let i=0;i<n;i++){const h=dir>0?i+1:n-i;for(let k=0;k<h;k++)set(x+i,11-k,mat);}},
    en(type,x,y=11){L.enemies.push(mkEnemy(type,x,y));},
    deco(type,x,w=1){L.deco.push({type,x,w});},
    mover(x,y,w,ax,ay,per,ph=0){L.movers.push({bx:x*T,by:y*T,x:x*T,y:y*T,w:w*T,h:14,ax:ax*T,ay:ay*T,per,ph,dx:0,dy:0});},
    saw(x,y,ax,ay,per,ph=0){L.saws.push({bx:x*T+T/2,by:y*T+T/2,x:x*T+T/2,y:y*T+T/2,ax:ax*T,ay:ay*T,per,ph,r:15,dx:0,dy:0});}
  };
  def.make(a);if(def.wp)a.row(def.wp[0],def.wp[1],'W');
  const at=EXT[def.name];
  if(at){
    const N=56;
    for(const r of L.g)r.splice(at,0,...new Array(N).fill(AIR));
    L.w+=N;L.goal+=N;const X=at*T,D=N*T;
    for(const o of L.coins.concat(L.items))if(o.x>=X)o.x+=D;
    for(const e of L.enemies)if(e.x>=X){e.x+=D;if(e.bx!=null)e.bx+=D;}
    for(const m of L.movers.concat(L.saws))if(m.bx>=X){m.bx+=D;m.x+=D;}
    extraSection(a,at,def.theme,LEVELS.indexOf(def));
  }
  // arena za velikog zmaja ispred tvrđave
  if(def.boss){
    const x1=L.goal-14,x2=L.goal-1,mat=def.theme==='tvrdjava'?STONE:TOP;
    for(let x=x1;x<=x2;x++){for(let y=0;y<12;y++)L.g[y][x]=AIR;L.g[12][x]=mat;L.g[13][x]=DIRT;}
    const X1=x1*T,X2=(x2+1)*T,inA=x=>x>=X1-T&&x<X2;
    L.enemies=L.enemies.filter(e=>!inA(e.bx!=null?e.bx:e.x));L.coins=L.coins.filter(c=>!inA(c.x));L.items=L.items.filter(c=>!inA(c.x));
    L.saws=L.saws.filter(s=>!inA(s.bx));L.movers=L.movers.filter(m=>!(m.bx+m.w>X1-T&&m.bx<X2));
    L.boss={x:X2-T*5,y:12*T-64,w:76,h:64,vx:0,vy:0,hp:3,max:3,face:-1,t:0,hitT:0,fireT:0,dead:false,deadT:0,active:false,lv:def.boss,x1:X1,x2:X2-T,wall:X2-2};
  }
  // novi pokloni: magnet, nevidljivost i dupli skok umesto po jednog kamena
  {const li=LEVELS.indexOf(def),cs=L.coins.slice().sort((a,b)=>a.x-b.x);
   [0.3,0.68].forEach((f,k)=>{const c=cs[Math.floor(cs.length*f)];if(!c)return;L.coins.splice(L.coins.indexOf(c),1);L.pows.push({x:c.x,y:c.y,kind:POWS[(Math.max(0,li)+k)%3],got:false});});}
  {const li=LEVELS.indexOf(def);if(li%2===1)placeSecret(L);}
  L.totalGems=L.coins.length;for(const r of L.g)for(const t of r)if(t===CRATE)L.totalGems++;
  moveThings(L);L.movers.forEach(m=>{m.dx=0;m.dy=0;});
  return L;
}
// tajna soba: napukao zid (razbija se mačem ili praćkom), iza njega sanduk i drago kamenje
function placeSecret(L){
  const W=6,GROUND=[TOP,STONE,DIRT,CLOUD],g=L.g;
  const hi=L.goal-(L.boss?20:8)-W,lo=10;
  const busy=(x1,x2)=>{const X1=x1*T,X2=(x2+1)*T,inR=x=>x>=X1&&x<X2;
    return L.items.some(c=>inR(c.x))||L.pows.some(c=>inR(c.x))||L.enemies.some(e=>e.type==='ptica'&&inR(e.bx))||
      L.movers.some(m=>Math.max(m.by,m.by+m.ay)>5*T&&Math.min(m.bx,m.bx+m.ax)<X2&&Math.max(m.bx,m.bx+m.ax)+m.w>X1)||L.saws.some(m=>Math.max(m.by,m.by+m.ay)>5*T&&Math.min(m.bx,m.bx+m.ax)-20<X2&&Math.max(m.bx,m.bx+m.ax)+20>X1);};
  const ok=c=>{if(L.cp>=c-3&&L.cp<=c+W+1)return false;
    for(let x=c-3;x<c+W;x++){if(!GROUND.includes(g[12][x]))return false;const y0=x>=c&&x<c+W?6:9;for(let y=y0;y<12;y++)if(g[y][x]!==AIR)return false;}
    return !busy(c-1,c+W);};

/* ---------- Helpers ---------- */
// Serbian Latin -> Cyrillic for everything shown on screen; text inside {braces} stays as is (key names)
const CYR={a:'а',b:'б',c:'ц',č:'ч',ć:'ћ',d:'д',đ:'ђ',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с',š:'ш',t:'т',u:'у',v:'в',z:'з',ž:'ж',q:'к',w:'в',x:'кс',y:'ј'};
function cyrPart(t){
  return t.replace(/D[žŽ]|d[žŽ]|L[jJ]|l[jJ]|N[jJ]|n[jJ]|[A-Za-zčćđšžČĆĐŠŽ]/g,m=>{
    const low=m.toLowerCase();const up=m[0]!==m[0].toLowerCase();
    const r=low==='dž'?'џ':low==='lj'?'љ':low==='nj'?'њ':(CYR[low]||m);
    return up?r.toUpperCase():r;});
}
function cyr(t){if(t==null)return t;if(lang==='en')return String(t).replace(/\{([^}]*)\}/g,'$1');return String(t).split(/\{([^}]*)\}/).map((x,i)=>i%2?x:cyrPart(x)).join('');}

function collideX(o){
  const y0=Math.floor(o.y/T),y1=Math.floor((o.y+o.h-0.01)/T);
  if(o.vx>0){const cx=Math.floor((o.x+o.w-0.01)/T);for(let cy=y0;cy<=y1;cy++)if(solid(cx,cy)){o.x=cx*T-o.w;return true;}}
  else if(o.vx<0){const cx=Math.floor(o.x/T);for(let cy=y0;cy<=y1;cy++)if(solid(cx,cy)){o.x=(cx+1)*T;return true;}}
  return false;
}
function collideY(o,isHero){
  const x0=Math.floor((o.x+0.01)/T),x1=Math.floor((o.x+o.w-0.01)/T);
  if(o.vy>0){
    const cy=Math.floor((o.y+o.h-0.01)/T);
    for(let cx=x0;cx<=x1;cx++)if(solid(cx,cy)){
      o.y=cy*T-o.h;o.vy=0;o.ground=true;
      if(isHero){const s=x0===x1?x0:(tileAt(x0,cy)===SPR?x0:tileAt(x1,cy)===SPR?x1:-1);
        if(s>=0&&tileAt(s,cy)===SPR){o.vy=K.j?SPRING-1.5:SPRING;o.ground=false;o.jumping=false;lvl.springs[s+','+cy]=12;sfx('spring');}}

function updateEnemies(){

const TUNES=[
  {name:'Oda radosti (Betoven)',n:[[659,.22],[659,.22],[698,.22],[784,.22],[784,.22],[698,.22],[659,.22],[587,.22],[523,.22],[523,.22],[587,.22],[659,.22],[659,.33],[587,.11],[587,.5]]},
  {name:'Mala noćna muzika (Mocart)',n:[[392,.3],[0,.15],[294,.15],[392,.3],[0,.15],[294,.15],[392,.15],[294,.15],[392,.15],[494,.15],[587,.6],[0,.1],[523,.3],[0,.15],[440,.15],[523,.3],[0,.15],[440,.15],[523,.15],[440,.15],[370,.15],[440,.15],[294,.6]]},
  {name:'Turski marš (Mocart)',n:[[494,.12],[440,.12],[415,.12],[440,.12],[523,.36],[587,.12],[523,.12],[494,.12],[523,.12],[659,.36],[698,.12],[659,.12],[622,.12],[659,.12],[988,.12],[880,.12],[831,.12],[880,.12],[988,.12],[880,.12],[831,.12],[880,.12],[1047,.55]]}

function playMusic(){
  const tune=TUNES[(P().level)%TUNES.length];
  const total=tune.n.reduce((t,x)=>t+x[1],0);
  if(!AC||muted)return total;
  const t0=AC.currentTime+0.05;
  const note=(f,t,d,type,vol)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.setValueAtTime(vol,t+d*0.75);g.gain.exponentialRampToValueAtTime(.0001,t+d*0.98);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05);};
  let t=t0;for(const [f,d] of tune.n){if(f){note(f,t,d,'square',.055);note(f/2,t,d,'triangle',.09);}t+=d;}
  return total;
}
function finishLevel(){
  const pl=P(),prev=cur;
  // zvezdice: 1 za pređen nivo, 2 za bar 40% kamenja, 3 za bar 70% kamenja bez izgubljenog života
  const ratio=lvl.totalGems?pl.gems.size/lvl.totalGems:1;
  const st=1+(ratio>=0.4?1:0)+(ratio>=0.7&&!pl.lost?1:0);
  pl.stars+=st;pl.lastStars=st;addScore(st*100);pl.gems=new Set();pl.lost=false;
  pl.level++;pl.cp=null;
  if(pl.level>=LEVELS.length){
    pl.done=true;addScore(2000);
    return startEnding(()=>{const n=pick();if(n<0)return gameOver();prepareTurn(n,'done',prev);});
  }
  prepareTurn(cur,'level',prev);
}

  rows.forEach(r=>{if(r.stars)r.line+=' · ★ '+r.stars;});

const TEST_HORSE=false; // true = igrač kreće na konju (za testiranje)

/* ---------- Najbolji rezultati (10 najboljih, čuvaju se na uređaju) ---------- */
const HS_KEY='ptv-najbolji-v1';
function loadScores(){try{const a=JSON.parse(localStorage.getItem(HS_KEY)||'[]');return Array.isArray(a)?a.filter(e=>e&&typeof e.s==='number'):[];}catch(e){return [];}}
function saveScores(a){try{localStorage.setItem(HS_KEY,JSON.stringify(a));}catch(e){}}
let hsMem=null;
function getScores(){if(!hsMem)hsMem=loadScores();return hsMem;}
function addScores(list){
  // list: [{h,s,l}] -> vraća id-jeve unetih rezultata koji su ušli u 10 najboljih
  const all=getScores().slice();const d=new Date();
  const date=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()+'.';
  const ids=[];
  for(const e of list){if(e.s<=0)continue;const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);ids.push(id);all.push({id,h:e.h,s:e.s,l:e.l,d:date});}
  all.sort((a,b)=>b.s-a.s);  // stabilno: stariji rezultat ostaje ispred kod istog broja poena
  hsMem=all.slice(0,10);saveScores(hsMem);
  return ids.filter(id=>hsMem.some(x=>x.id===id));

/* ---------- Resize ---------- */
function resize(){
  const r=stage.getBoundingClientRect();const aw=Math.max(100,r.width),ah=Math.max(100,r.height);
  VW=Math.max(10*T,Math.min(40*T,Math.round(H*aw/ah)));
  scale=Math.min(aw/VW,ah/H);dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=Math.floor(VW*scale)+'px';cv.style.height=Math.floor(H*scale)+'px';
  cv.width=Math.round(VW*scale*dpr);cv.height=Math.round(H*scale*dpr);
  if(lvl)cam=clampCam(cam);
}
new ResizeObserver(resize).observe(stage);resize();

/* ---------- Loop ---------- */
function step(){
  tick++;
  if(state!=='paused'){lvl.t++;moveThings(lvl);}
  for(const b of lvl.bumps)b.t--;lvl.bumps=lvl.bumps.filter(b=>b.t>0);
  for(const k in lvl.springs)if(--lvl.springs[k]<=0)delete lvl.springs[k];
  if(state==='play'){updateHero();if(state==='play'){updateShots();updateEnemies();}if(state==='play'){updateBoss();updateFire();}}
  else if(state==='dying'){hero.vy=Math.min(hero.vy+GRAV,13);hero.y+=hero.vy;if(++dieT>95)handleDeath();}
  else if(state==='win')updateWin();
  else if(state==='ending')updateEnding();
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;if(p.type==='coin')p.vy+=0.5;else if(p.type==='dot')p.vy+=0.12;p.life--;}
  particles=particles.filter(p=>p.life>0);
  if(hero&&(state==='play'||state==='win'))cam+=(clampCam(hero.x-VW*0.4)-cam)*0.12;
}
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000);last=now;
  while(acc>=1/60){if(state!=='paused')step();acc-=1/60;}
  render();updHud();requestAnimationFrame(frame);
}

/* ---------- Drawing ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);g.fill();}

    g.font='16px "Nunito",sans-serif';g.lineWidth=4;const st=cyr(tr((c.f?'Stigla':'Stigao')+' si do Kraljeve tvrđave!',"You reached the King's Castle!"));g.strokeText(st,cx,92);g.fillStyle='#ffffff';g.fillText(st,cx,92);
    g.globalAlpha=1;
  }
}

      ctx.beginPath();ctx.moveTo(cx0-17,by-60);ctx.lineTo(cx0-5,by-82);ctx.lineTo(cx0+7,by-60);ctx.fill();ctx.beginPath();ctx.moveTo(cx0+49,by-54);ctx.lineTo(cx0+61,by-76);ctx.lineTo(cx0+73,by-54);ctx.fill();

    const pines=(par,col,base,sp)=>{ctx.fillStyle=col;const span=VW+sp*3;for(let i=0;i<14;i++){const x=wrap(i*sp-cam*par,span)-sp;const h=90+hash(i,par*3)*90;

    pines(0.22,th.far,330,70);pines(0.45,th.near,370,95);
    for(let i=0;i<10;i++){ctx.globalAlpha=0.5+0.5*Math.sin(tick*0.05+i*2);ctx.fillStyle='#e8ff7a';circ(ctx,wrap(i*113+Math.sin(tick*0.01+i)*30-cam*0.7,VW),220+Math.sin(tick*0.02+i*3)*60,2);}ctx.globalAlpha=1;
  }else{

function drawTile(t,x,y,cx,cy,th){
  switch(t){
    case TOP:
      if(lvl.theme==='nebo'){
        ctx.fillStyle=th.dirt;ctx.fillRect(x,y+8,T,T-8);
        ctx.fillStyle='#ffffff';ctx.fillRect(x,y+3,T,9);circ(ctx,x+8,y+5,5);circ(ctx,x+24,y+5,5);circ(ctx,x+16,y+4,4.5);
        ctx.fillStyle=th.topD;ctx.fillRect(x,y+12,T,3);
      }else{
        // kameni put sa čupercima trave
        ctx.fillStyle=th.dirt;ctx.fillRect(x,y,T,T);
        const o=(cx%2)*8;
        ctx.fillStyle=th.dirtD;rr(ctx,x+1-o,y+4,15,9,3.5);ctx.fill();rr(ctx,x+17-o,y+4,15,9,3.5);ctx.fill();if(o)rr(ctx,x+33-o,y+4,15,9,3.5),ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x,y+4,T,2);
        ctx.fillStyle=th.dirtD;ctx.globalAlpha=.75;rr(ctx,x+5,y+16,12,8,3);ctx.fill();rr(ctx,x+19,y+18,11,7,3);ctx.fill();ctx.globalAlpha=1;
        ctx.fillStyle=th.top;for(let k=0;k<T;k+=6){const hh=4+hash(cx*7+k,cy)*4;ctx.beginPath();ctx.moveTo(x+k,y+5);ctx.lineTo(x+k+3,y+5-hh);ctx.lineTo(x+k+6,y+5);ctx.fill();}
        ctx.fillStyle=th.topD;ctx.fillRect(x,y+3,T,2);
      }break;
    case DIRT:{
      ctx.fillStyle=th.dirt;ctx.fillRect(x,y,T,T);
      ctx.fillStyle=th.dirtD;ctx.globalAlpha=.6;const o=((cx+cy)%2)*8;
      rr(ctx,x+2-o,y+3,14,9,3.5);ctx.fill();rr(ctx,x+18-o,y+3,14,9,3.5);ctx.fill();if(o){rr(ctx,x+34-o,y+3,14,9,3.5);ctx.fill();}
      rr(ctx,x+6,y+18,13,9,3.5);ctx.fill();rr(ctx,x+22,y+18,12,9,3.5);ctx.fill();ctx.globalAlpha=1;
      break;}
    case BRICK:
      // drvena greda od dasaka
      ctx.fillStyle='#8a5a2b';rr(ctx,x,y+1,T,T-2,4);ctx.fill();
      ctx.fillStyle='#a8733a';ctx.fillRect(x+2,y+3,T-4,8);ctx.fillRect(x+2,y+13,T-4,8);ctx.fillRect(x+2,y+23,T-4,6);
      ctx.fillStyle='#6b4a2a';ctx.fillRect(x+2,y+11,T-4,2);ctx.fillRect(x+2,y+21,T-4,2);
      ctx.fillStyle='#4a3424';circ(ctx,x+6,y+7,1.3);circ(ctx,x+T-6,y+7,1.3);circ(ctx,x+6,y+17,1.3);circ(ctx,x+T-6,y+17,1.3);circ(ctx,x+6,y+26,1.3);circ(ctx,x+T-6,y+26,1.3);
      break;
    case CRATE:{
      // zatvoren sanduk sa blagom
      const p=0.25+0.2*Math.sin(tick*0.1+cx);ctx.fillStyle=`rgba(255,215,94,${p})`;circ(ctx,x+16,y+16,19);
      ctx.fillStyle='#7a4a26';rr(ctx,x+1,y+12,T-2,T-12,3);ctx.fill();
      ctx.fillStyle='#8a5a2b';rr(ctx,x+1,y+2,T-2,12,6);ctx.fill();
      ctx.fillStyle='#ffd75e';ctx.fillRect(x+1,y+12,T-2,3);ctx.fillRect(x+5,y+2,3,T-3);ctx.fillRect(x+T-8,y+2,3,T-3);
      ctx.fillStyle='#ffd75e';rr(ctx,x+12,y+10,8,9,2);ctx.fill();ctx.fillStyle='#4a3424';ctx.fillRect(x+15,y+13,2,4);
      break;}
    case USED:
      // otvoren, prazan sanduk
      ctx.fillStyle='#5c3b22';rr(ctx,x+1,y+12,T-2,T-12,3);ctx.fill();
      ctx.fillStyle='#3a2414';ctx.fillRect(x+4,y+12,T-8,4);
      ctx.fillStyle='#6b4a2a';rr(ctx,x+1,y+3,T-2,8,4);ctx.fill();
      ctx.fillStyle='#c9a23e';ctx.fillRect(x+1,y+12,T-2,2);ctx.fillRect(x+5,y+14,3,T-15);ctx.fillRect(x+T-8,y+14,3,T-15);
      break;
    case SPIKE:
      ctx.fillStyle='#7c8597';ctx.fillRect(x,y+28,T,4);
      for(let k=0;k<3;k++){const bx=x+1+k*10.3;ctx.fillStyle='#d5dbe7';ctx.beginPath();ctx.moveTo(bx,y+28);ctx.lineTo(bx+5,y+12);ctx.lineTo(bx+10,y+28);ctx.fill();
        ctx.fillStyle='#9aa3b5';ctx.beginPath();ctx.moveTo(bx+5,y+12);ctx.lineTo(bx+10,y+28);ctx.lineTo(bx+6,y+28);ctx.fill();}
      break;
    case LAVA:
      if(tileAt(cx,cy-1)!==LAVA){
        ctx.fillStyle='#e8480f';ctx.fillRect(x,y+8,T,T-8);
        ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.moveTo(x,y+T);
        for(let k=0;k<=T;k+=4)ctx.lineTo(x+k,y+8+Math.sin((x+k)*0.15+tick*0.08)*3);
        ctx.lineTo(x+T,y+T);ctx.fill();
        ctx.fillStyle='#ffd23a';for(let k=0;k<=T;k+=4)ctx.fillRect(x+k,y+7+Math.sin((x+k)*0.15+tick*0.08)*3,4,2);
        if(hash(cx,Math.floor(tick/40))>0.7){ctx.fillStyle='#ffd23a';circ(ctx,x+16,y+6-(tick%40)/4,2.5);}
      }else{ctx.fillStyle='#c93a0c';ctx.fillRect(x,y,T,T);ctx.fillStyle='#e8480f';ctx.fillRect(x+hash(cx,cy)*20,y+8,8,6);}
      break;
    case SPR:{
      const sq=lvl.springs[cx+','+cy]?6:0;
      ctx.fillStyle='#4a4f63';ctx.fillRect(x+3,y+27,T-6,5);
      ctx.strokeStyle='#c9cfd9';ctx.lineWidth=3;ctx.beginPath();const top=y+10+sq;
      for(let k=0;k<=4;k++){const yy=top+(y+27-top)*k/4;ctx.lineTo(k%2?x+23:x+9,yy);}ctx.stroke();
      ctx.fillStyle='#e23b3b';rr(ctx,x+2,top-5,T-4,7,3);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(x+5,top-4,T-10,2);
      break;}
    case STONE:
      ctx.fillStyle=th.stone;ctx.fillRect(x,y,T,T);
      ctx.fillStyle=th.stoneHi;ctx.fillRect(x,y,T,3);ctx.fillRect(x,y,3,T);
      ctx.fillStyle=th.stoneLo;ctx.fillRect(x,y+T-3,T,3);ctx.fillRect(x+T-3,y,3,T);
      if(hash(cx,cy)>0.6){ctx.fillRect(x+8,y+10,8,2);ctx.fillRect(x+15,y+12,2,6);}
      break;
    case CRACK:{
      // napukao zid: kamen sa širokom cik-cak pukotinom kroz koju sija zlatna svetlost
      const top=tileAt(cx,cy-1)!==CRACK,bot=tileAt(cx,cy+1)!==CRACK;
      ctx.fillStyle=th.stone;ctx.fillRect(x,y,T,T);
      ctx.fillStyle=th.stoneHi;ctx.fillRect(x,y,T,3);ctx.fillRect(x,y,3,T);
      ctx.fillStyle=th.stoneLo;ctx.fillRect(x,y+T-3,T,3);ctx.fillRect(x+T-3,y,3,T);
      // okrnjene ivice
      ctx.fillStyle=th.stoneLo;
      if(top){ctx.beginPath();ctx.moveTo(x+T,y);ctx.lineTo(x+T-9,y);ctx.lineTo(x+T,y+7);ctx.fill();}
      if(bot){ctx.beginPath();ctx.moveTo(x,y+T);ctx.lineTo(x+8,y+T);ctx.lineTo(x,y+T-6);ctx.fill();}
      // glavna pukotina (srednja linija i širina u svakoj tački)
      const mid=top?[[17,-1,1.2],[14,5,2.6],[19,10,3.8],[15,16,4.6],[20,23,4.2],[16,33,3]]:[[16,-1,3],[21,5,4],[16,12,4.6],[18,18,3.6],[13,25,2.6],[15,33,1.2]];
      const gap=(k)=>{ctx.beginPath();mid.forEach(([mx,my],i)=>{const w=mid[i][2]*k;i?ctx.lineTo(x+mx-w,y+my):ctx.moveTo(x+mx-w,y+my);});
        for(let i=mid.length-1;i>=0;i--){const [mx,my]=mid[i],w=mid[i][2]*k;ctx.lineTo(x+mx+w*0.8,y+my+1);}ctx.closePath();};
      const gl=0.55+0.4*Math.sin(tick*0.11+cx*0.7);
      ctx.save();
      ctx.fillStyle=`rgba(255,200,70,${gl*0.28})`;gap(1.8);ctx.fill();   // sjaj oko pukotine
      ctx.fillStyle='#1b1630';gap(1.15);ctx.fill();                         // tamni procep
      ctx.fillStyle=`rgba(255,226,122,${gl*0.9})`;gap(0.3);ctx.fill();      // svetlost iznutra
      // sitne prsline
      ctx.strokeStyle='#2a2240';ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();
      const br=top?[[20,12,28,9,31,11],[12,19,5,16,2,19]]:[[13,13,6,10,3,12],[20,20,27,24,30,23]];
      for(const b of br){ctx.moveTo(x+b[0],y+b[1]);ctx.lineTo(x+b[2],y+b[3]);ctx.lineTo(x+b[4],y+b[5]);}ctx.stroke();
      ctx.restore();
      // otpali kamenčići na dnu
      if(bot){ctx.fillStyle=th.stoneLo;circ(ctx,x-4,y+T-3,3.2);circ(ctx,x+T+3,y+T-2,2.4);ctx.fillStyle=th.stone;circ(ctx,x-9,y+T-2,2.2);}
      // svetlucanje
      if(top){const k=(Math.sin(tick*0.09+cx*1.7)+1)/2,r=3+k*5,sx=x+5,sy=y+5;
        ctx.fillStyle=`rgba(255,240,170,${0.3+k*0.7})`;ctx.beginPath();ctx.moveTo(sx,sy-r);ctx.lineTo(sx+r*.28,sy-r*.28);ctx.lineTo(sx+r,sy);ctx.lineTo(sx+r*.28,sy+r*.28);ctx.lineTo(sx,sy+r);ctx.lineTo(sx-r*.28,sy+r*.28);ctx.lineTo(sx-r,sy);ctx.lineTo(sx-r*.28,sy-r*.28);ctx.fill();}
      break;}
    case CLOUD:
      ctx.fillStyle='#d6ddfb';rr(ctx,x,y+6,T,T-6,8);ctx.fill();
      ctx.fillStyle='#ffffff';rr(ctx,x,y+4,T,T-10,8);ctx.fill();
      circ(ctx,x+10,y+8,8);circ(ctx,x+23,y+7,9);
      break;
  }
}

function drawEnemy(e){
  const x=e.x,y=e.y,f=e.face;
  if(e.type==='buba'){
    // goblin sa toljagom
    const cx0=x+12,by=y+e.h;
    if(e.dead){ctx.fillStyle='#6fae3c';ell(ctx,cx0,by-3,13,4);ctx.fillStyle='#7a4a26';ell(ctx,cx0,by-1,10,2);ctx.fillStyle='#1a1a24';ctx.fillRect(cx0-5,by-5,3,1.5);ctx.fillRect(cx0+2,by-5,3,1.5);return;}
    ctx.save();ctx.translate(cx0,by);if(f<0)ctx.scale(-1,1);
    const bb=Math.abs(Math.sin(e.t*0.25))*1.5,st=Math.sin(e.t*0.35)*2;ctx.translate(0,-bb);
    ctx.fillStyle='#2f5d2a';ctx.fillRect(-6+st,-5,4,5);ctx.fillRect(2-st,-5,4,5);
    ctx.fillStyle='#7a4a26';rr(ctx,-8,-14,16,10,3);ctx.fill();ctx.fillStyle='#5b3b22';ctx.fillRect(-8,-7,16,2);
    ctx.fillStyle='#6fae3c';rr(ctx,-8,-26,16,13,6);ctx.fill();

  else{ctx.fillStyle='#f6e7b8';ctx.fillRect(17,-23,1,1.4);ctx.fillRect(20,-23,1,1.4);}
  // prednje krilo
  ctx.fillStyle='#9a2f6e';ctx.beginPath();ctx.moveTo(-1,-17);ctx.lineTo(-9,-33-fl*6);ctx.lineTo(-4,-27);ctx.lineTo(3,-36-fl*7);ctx.lineTo(6,-18);ctx.fill();
  ctx.restore();
  if(!b.dead){// srca iznad zmaja
    ctx.font='900 18px "Rubik",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(20,24,51,.85)';
    for(let i=0;i<b.max;i++){const x=b.x+b.w/2+(i-(b.max-1)/2)*20,y=b.y-46;ctx.strokeText('♥',x,y);ctx.fillStyle=i<b.hp?'#ff5a7a':'#3a3f5a';ctx.fillText('♥',x,y);}
  }
}
function render(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(state==='ending'){drawEnding(ctx,VW,H,endT,P().c,fw,P().weapon);return;}
  const th=THEMES[lvl.theme];
  drawBg(th);
  const c=Math.round(cam);
  ctx.save();ctx.translate(-c,0);
  drawGoal(th);drawCheckpoint();
  for(const d of lvl.deco)drawDeco(d);
  const x0=Math.max(0,Math.floor(c/T)),x1=Math.min(lvl.w-1,Math.floor((c+VW)/T)+1);
  for(let cy=0;cy<ROWS;cy++)for(let cx=x0;cx<=x1;cx++){
    const t=lvl.g[cy][cx];if(!t)continue;
    let off=0;for(const b of lvl.bumps)if(b.cx===cx&&b.cy===cy)off=Math.sin((10-b.t)/10*Math.PI)*7;
    drawTile(t,cx*T,cy*T-off,cx,cy,th);
  }
  for(const m of lvl.movers)drawMover(m,th);
  for(const s of lvl.saws)drawSaw(s);
  for(const co of lvl.coins)if(!co.got&&co.x>c-20&&co.x<c+VW+20)drawCoin(co.x,co.y,tick*0.08+co.x*0.01);
  for(const it of lvl.items)if(!it.got){const by=it.y+Math.sin(tick*0.08)*4;if(players&&(P().weapon||0)>=2)drawGift(it.x,by);else drawPick(it.x,by);}
  for(const pw of lvl.pows)if(!pw.got)drawPow(pw.kind,pw.x,pw.y+Math.sin(tick*0.08+pw.x*0.01)*4);
  for(const s of lvl.shots){if(s.sup){drawStar(ctx,s.x,s.y,8,tick*0.3);}else{ctx.fillStyle='#6d6458';circ(ctx,s.x,s.y,4.5);ctx.fillStyle='#b8ad9c';circ(ctx,s.x-1.2,s.y-1.2,2);}}
  if(lvl.secret!=null&&!lvl.secretOpen&&lvl.secret*T<c+VW&&(lvl.secret+6)*T>c){for(let cy=10;cy<=11;cy++)for(let cx=lvl.secret+1;cx<=lvl.secret+4;cx++)drawTile(STONE,cx*T,cy*T,cx,cy,th);}
  for(const e of lvl.enemies)if(!e.gone&&e.x>c-40&&e.x<c+VW+40&&(!e.dead||e.squish))drawEnemy(e);
  if(lvl.boss)drawBoss(lvl.boss);
  for(const f of lvl.fire)drawFire(f);
  if(state==='title'){
    HEROES.forEach((c,i)=>drawHero(ctx,c,(3+i*2)*T,12*T-30-Math.abs(Math.sin(tick*0.06+i*1.4))*6,i%2?-1:1,0,false,false));
  }else if(hero&&!hero.hidden&&players){
    const h=hero;const air=!h.ground&&state==='play';
    if(state==='dying'){ctx.save();ctx.translate(h.x+11,h.y+15);ctx.rotate(Math.min(dieT*0.06,Math.PI));drawHero(ctx,P().c,-11,-15,h.face,0,true,true);ctx.restore();}
    else if(!(h.inv>0&&tick%6<3)){
      const ghost=players&&P().inv2>0;if(ghost)ctx.globalAlpha=P().inv2<90&&tick%10<5?0.8:0.38;
      const sw=h.atk>0?(-1.7+(14-h.atk)/14*3.0):null;
      if(P().horse)drawRiding(ctx,P().c,h.x+h.w/2,h.y+h.h,h.face,tick*0.35,Math.abs(h.vx)>0.4||state==='win',air);else drawHero(ctx,P().c,h.x,h.y,h.face,h.dist*0.18,air||h.phase==='slide',false,P().weapon,P().armor,sw);
      if(h.atk>3){// bela crta zamaha ispred viteza
        const k=(14-h.atk)/10,cxs=h.x+h.w/2+h.face*6,cys=h.y+h.h*0.5,R=P().horse?34:26;
        ctx.save();ctx.translate(cxs,cys);if(h.face<0)ctx.scale(-1,1);ctx.strokeStyle='rgba(255,255,255,'+(0.85-k*0.5)+')';ctx.lineWidth=4;ctx.lineCap='round';
        ctx.beginPath();ctx.arc(0,0,R,-1.4,-1.4+Math.min(1,k*1.4)*2.4);ctx.stroke();ctx.strokeStyle='rgba(180,220,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,R-5,-1.2,-1.2+Math.min(1,k*1.4)*2.1);ctx.stroke();ctx.restore();}
      ctx.globalAlpha=1;
    }
  }
  for(const p of particles){
    const a=Math.max(0,p.life/p.max);
    if(p.type==='horse'){ctx.globalAlpha=Math.min(1,a*1.5);ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.face*0.62,0.62);drawHorse(ctx,tick*0.4,true,p.c,true);drawHorse(ctx,tick*0.4,true,p.c,false);ctx.restore();ctx.globalAlpha=1;}
    else if(p.type==='dot'){ctx.globalAlpha=a;ctx.fillStyle=p.col;circ(ctx,p.x,p.y,p.r);ctx.globalAlpha=1;}
    else if(p.type==='coin')drawCoin(p.x,p.y,tick*0.4);
    else{ctx.globalAlpha=Math.min(1,a*2);ctx.font='800 16px "Rubik",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(20,24,51,.85)';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;}
  }
  ctx.restore();
  // level name chip
  if(state==='play'&&lvl.t<150||state==='card'){
    ctx.globalAlpha=state==='card'?0:Math.min(1,(150-lvl.t)/30);
    ctx.font='800 18px "Rubik",sans-serif';ctx.textAlign='left';const txt=cyr(tr(lvl.name,lvl.en));const w=ctx.measureText(txt).width+24;
    const cx0=Math.round((VW-w)/2),cy0=matchMedia('(max-height:520px) and (orientation:landscape)').matches?Math.round(78/scale):12;ctx.fillStyle='rgba(19,24,51,.75)';rr(ctx,cx0,cy0,w,30,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(txt,cx0+12,cy0+21);ctx.globalAlpha=1;
  }
}

applyStatic();showTitle();dailyGift();
requestAnimationFrame(frame);
})();
</script>
