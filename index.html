<style>
/* Layout: one-screen arcade cabinet — score strip on top, game screen in the middle, thumb pad at the bottom */
:root{
  --bg:#131833; --panel:#1e2548; --panel-2:#283163; --ink:#f5f2ff; --muted:#a7aedb;
  --vojin:#3a6ee8; --vuk:#4cd06e; --gold:#ffc62b;
  --display:'Rubik','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.pl{min-width:0;display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:12px;background:var(--panel);border:2px solid transparent;opacity:.7;transition:opacity .2s,border-color .2s}
.pl.on{opacity:1;border-color:var(--c)}
.pl.out{opacity:.4}
.pl .top{display:flex;align-items:baseline;gap:6px;min-width:0}
.pl b{font-family:var(--display);font-weight:800;font-size:18px;color:var(--c);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .hearts{color:#ff5a7a;font-size:13px;letter-spacing:1px;white-space:nowrap}
.pl .stats{display:flex;gap:10px;font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.pl .stats span:first-child{color:var(--ink)}
.pl .coin{color:var(--gold)}
#hud1{text-align:right}
#hud1 .top,#hud1 .stats{justify-content:flex-end}
.mid{display:flex;flex-direction:column;gap:6px;justify-content:center}
.mid button{width:36px;height:30px;border-radius:9px;border:0;background:var(--panel-2);color:var(--ink);font:900 14px var(--body);cursor:pointer}
.mid button:focus-visible,.pad button:focus-visible,.card button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#btnSound.off{color:var(--muted);text-decoration:line-through}

/* Stage */
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center}
#c{display:block;border-radius:14px;box-shadow:0 0 0 3px #0b0f24,0 10px 30px rgba(0,0,0,.45);touch-action:none}

/* Overlay card */
.card{position:absolute;inset:auto;max-width:min(92%,440px);background:rgba(19,24,51,.94);border:3px solid #0b0f24;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.kicker{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,38px);line-height:1.05;text-wrap:balance;color:var(--hc,var(--ink))}
.card .info{margin:0;font-size:15px;font-weight:700;line-height:1.45;max-width:36ch;color:var(--ink)}
.card .hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.pors{display:flex;gap:14px;justify-content:center}
.pors canvas{width:56px;height:64px}
.rows{display:grid;gap:6px;width:100%}
.rows .r{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.rows .r b{font-family:var(--display);font-weight:800;font-size:18px;color:var(--c);text-align:left}
.rows .r span{color:var(--muted);font-size:13px;text-align:left}
.rows .r em{font-style:normal;font-size:18px}
.card button.go{margin-top:4px;border:0;border-radius:14px;padding:12px 30px;background:var(--gold);color:#2a1d00;font:800 22px var(--display);letter-spacing:.5px;cursor:pointer;box-shadow:0 4px 0 #b58300}
.card button.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b58300}
.card{max-height:calc(100% - 12px);overflow-y:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:14px;border:3px solid var(--panel-2);background:var(--panel);color:var(--ink);cursor:pointer;font-family:var(--body);min-width:0}
.opt:hover,.opt:focus-visible{border-color:var(--c,var(--gold));outline:none;background:var(--panel-2)}
.opt b{font:800 22px var(--display);color:var(--c,var(--ink))}
.opt small{font-size:12px;color:var(--muted);font-weight:800;line-height:1.3}
.opt canvas{width:48px;height:55px}
.alt{background:none;border:0;color:var(--muted);font:800 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 8px}
.alt:focus-visible{outline:3px solid var(--gold);border-radius:6px}
.pl.gone{visibility:hidden}

/* Touch pad */
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:none}
.pad .dirs{display:flex;gap:10px}
.pad button{touch-action:none;border:0;border-radius:18px;background:var(--panel-2);color:var(--ink);font:800 26px var(--display);width:76px;height:64px;box-shadow:0 4px 0 #0b0f24}
.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 #0b0f24;background:#3a4585}
.pad .jump{width:120px;background:var(--gold);color:#2a1d00;box-shadow:0 4px 0 #b58300;font-size:24px}
.pad .jump.on{background:#ffd75e;box-shadow:0 1px 0 #b58300}
.pad .shoot{width:88px;font-size:18px;background:#7a4a2a;color:#ffe9cf;box-shadow:0 4px 0 #4a2a14}
.pad .shoot.on{background:#9a6038;box-shadow:0 1px 0 #4a2a14}
.pad .shoot.dim{opacity:.35}
.pl .wp{color:#ffb36b}
@media (max-width:400px){.pad button{width:62px}.pad .jump{width:86px}.pad .shoot{width:70px;font-size:15px}}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media (max-height:520px) and (orientation:landscape){
  #app{gap:4px;padding-block:4px}
  .pl{padding:3px 8px}.pl b{font-size:15px}
  .pad{position:absolute;left:16px;right:16px;bottom:8px;pointer-events:none}
  .pad button{pointer-events:auto;opacity:.75;height:56px;width:64px}
  .pad .jump{width:96px}
  .pad .shoot.dim{opacity:.3}
}
@media (prefers-reduced-motion:reduce){.pl{transition:none}}
</style>

function mkEnemy(type,tx,ty){
  const d={buba:[24,20,-0.9],jez:[26,20,-0.6],ptica:[26,18,0]}[type];
  const e={type,w:d[0],h:d[1],vx:d[2],vy:0,x:tx*T+(T-d[0])/2,y:(ty+1)*T-d[1],active:false,dead:false,deadT:0,t:0,face:-1,ground:false};
  if(type==='ptica'){e.bx=e.x;e.by=ty*T+6;e.amp=T*2.5;e.y=e.by;}
  return e;
}
function build(def){
  const L={name:def.name,theme:def.theme,w:def.w,g:Array.from({length:ROWS},()=>new Array(def.w).fill(AIR)),
    enemies:[],coins:[],items:[],shots:[],deco:[],movers:[],saws:[],bumps:[],springs:{},cp:def.cp,goal:def.goal,t:0};
  const set=(x,y,t)=>{if(x>=0&&x<L.w&&y>=0&&y<ROWS)L.g[y][x]=t;};
  const MAP={B:BRICK,K:CRATE,S:STONE,C:CLOUD,'^':SPIKE,J:SPR};
  const a={
    ground(x1,x2,top=12,mat=TOP){for(let x=x1;x<=x2;x++){set(x,top,mat);for(let y=top+1;y<ROWS;y++)set(x,y,DIRT);}},
    lava(x1,x2){for(let x=x1;x<=x2;x++){set(x,12,LAVA);set(x,13,LAVA);}},
    fill(x1,x2,y1,y2,mat){for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)set(x,y,mat);},
    row(x,y,s){[...s].forEach((ch,i)=>{if(ch==='o')L.coins.push({x:(x+i)*T+T/2,y:y*T+T/2,got:false});else if(ch==='W')L.items.push({x:(x+i)*T+T/2,y:y*T+T/2,got:false});else if(MAP[ch]!==undefined)set(x+i,y,MAP[ch]);});},
    stairs(x,n,dir=1,mat=STONE){for(let i=0;i<n;i++){const h=dir>0?i+1:n-i;for(let k=0;k<h;k++)set(x+i,11-k,mat);}},
    en(type,x,y=11){L.enemies.push(mkEnemy(type,x,y));},
    deco(type,x,w=1){L.deco.push({type,x,w});},
    mover(x,y,w,ax,ay,per,ph=0){L.movers.push({bx:x*T,by:y*T,x:x*T,y:y*T,w:w*T,h:14,ax:ax*T,ay:ay*T,per,ph,dx:0,dy:0});},
    saw(x,y,ax,ay,per,ph=0){L.saws.push({bx:x*T+T/2,by:y*T+T/2,x:x*T+T/2,y:y*T+T/2,ax:ax*T,ay:ay*T,per,ph,r:15,dx:0,dy:0});}
  };
  def.make(a);if(def.wp)a.row(def.wp[0],def.wp[1],'W');
  const at=EXT[def.name];
  if(at){
    const N=56;
    for(const r of L.g)r.splice(at,0,...new Array(N).fill(AIR));
    L.w+=N;L.goal+=N;const X=at*T,D=N*T;
    for(const o of L.coins.concat(L.items))if(o.x>=X)o.x+=D;
    for(const e of L.enemies)if(e.x>=X){e.x+=D;if(e.bx!=null)e.bx+=D;}
    for(const m of L.movers.concat(L.saws))if(m.bx>=X){m.bx+=D;m.x+=D;}
    extraSection(a,at,def.theme,LEVELS.indexOf(def));
  }
  moveThings(L);L.movers.forEach(m=>{m.dx=0;m.dy=0;});
  return L;
}
function moveThings(L){
  for(const m of L.movers.concat(L.saws)){
    const off=(1-Math.cos(2*Math.PI*(L.t/60/m.per+m.ph)))/2;
    const nx=m.bx+m.ax*off,ny=m.by+m.ay*off;
    m.dx=nx-m.x;m.dy=ny-m.y;m.x=nx;m.y=ny;
  }
}

function sfx(n){
  if(!AC||muted)return;const t0=AC.currentTime;
  for(const [f,st,du,ty='square',f2] of SFX[n]){
    const o=AC.createOscillator(),g=AC.createGain();o.type=ty;
    o.frequency.setValueAtTime(f,t0+st);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+st+du);
    g.gain.setValueAtTime(.0001,t0+st);g.gain.exponentialRampToValueAtTime(.09,t0+st+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+st+du);
    o.connect(g).connect(AC.destination);o.start(t0+st);o.stop(t0+st+du+.02);
  }
}

/* ---------- Helpers ---------- */
// Serbian Latin -> Cyrillic for everything shown on screen; text inside {braces} stays as is (key names)
const CYR={a:'а',b:'б',c:'ц',č:'ч',ć:'ћ',d:'д',đ:'ђ',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с',š:'ш',t:'т',u:'у',v:'в',z:'з',ž:'ж',q:'к',w:'в',x:'кс',y:'ј'};
function cyrPart(t){
  return t.replace(/D[žŽ]|d[žŽ]|L[jJ]|l[jJ]|N[jJ]|n[jJ]|[A-Za-zčćđšžČĆĐŠŽ]/g,m=>{
    const low=m.toLowerCase();const up=m[0]!==m[0].toLowerCase();
    const r=low==='dž'?'џ':low==='lj'?'љ':low==='nj'?'њ':(CYR[low]||m);
    return up?r.toUpperCase():r;});
}
function cyr(t){if(t==null)return t;return String(t).split(/\{([^}]*)\}/).map((x,i)=>i%2?x:cyrPart(x)).join('');}
const tileAt=(cx,cy)=>(cy<0||cy>=ROWS)?AIR:(cx<0||cx>=lvl.w)?STONE:lvl.g[cy][cx];
const solid=(cx,cy)=>SOLID[tileAt(cx,cy)]===1;
const ov=(a,b,s=0)=>a.x+s<b.x+b.w&&a.x+a.w-s>b.x&&a.y+s<b.y+b.h&&a.y+a.h-s>b.y;
const clampCam=v=>Math.max(0,Math.min(lvl.w*T-VW,v));

function collideX(o){
  const y0=Math.floor(o.y/T),y1=Math.floor((o.y+o.h-0.01)/T);
  if(o.vx>0){const cx=Math.floor((o.x+o.w-0.01)/T);for(let cy=y0;cy<=y1;cy++)if(solid(cx,cy)){o.x=cx*T-o.w;return true;}}
  else if(o.vx<0){const cx=Math.floor(o.x/T);for(let cy=y0;cy<=y1;cy++)if(solid(cx,cy)){o.x=(cx+1)*T;return true;}}
  return false;
}
function collideY(o,isHero){
  const x0=Math.floor((o.x+0.01)/T),x1=Math.floor((o.x+o.w-0.01)/T);
  if(o.vy>0){
    const cy=Math.floor((o.y+o.h-0.01)/T);
    for(let cx=x0;cx<=x1;cx++)if(solid(cx,cy)){
      o.y=cy*T-o.h;o.vy=0;o.ground=true;
      if(isHero){const s=x0===x1?x0:(tileAt(x0,cy)===SPR?x0:tileAt(x1,cy)===SPR?x1:-1);
        if(s>=0&&tileAt(s,cy)===SPR){o.vy=K.j?SPRING-1.5:SPRING;o.ground=false;o.jumping=false;lvl.springs[s+','+cy]=12;sfx('spring');}}
      return;
    }
  }else if(o.vy<0){
    const cy=Math.floor(o.y/T);let hit=-1,best=1e9;
    for(let cx=x0;cx<=x1;cx++)if(solid(cx,cy)){const d=Math.abs(cx*T+T/2-(o.x+o.w/2));if(d<best){best=d;hit=cx;}}
    if(hit>=0){o.y=(cy+1)*T;o.vy=0;if(isHero)bump(hit,cy);}
  }
}
function bump(cx,cy){
  const t=tileAt(cx,cy);
  if(t===CRATE){lvl.g[cy][cx]=USED;coinPop(cx*T+T/2,cy*T);addCoin();sfx('coin');}
  else sfx('bump');
  if(t===CRATE||t===BRICK||t===USED){
    lvl.bumps.push({cx,cy,t:10});
    for(const e of lvl.enemies){if(e.dead||e.type==='ptica')continue;
      if(Math.abs(e.y+e.h-cy*T)<5&&e.x+e.w>cx*T&&e.x<cx*T+T){killEnemy(e,false);}}
  }
}

function spawnHero(){
  const pl=players?P():null;const tx=pl&&pl.cp?pl.cp:2;let gy=12*T;
  for(let cy=1;cy<ROWS;cy++){if(SOLID[lvl.g[cy][tx]]&&!SOLID[lvl.g[cy-1][tx]]){gy=cy*T;break;}}
  hero={x:tx*T+5,y:gy-30,w:22,h:30,vx:0,vy:0,face:1,ground:true,ride:null,buf:0,coy:0,jumping:false,dist:0,phase:null,pt:0,hidden:false,cool:0,inv:0};
  if(pl&&pl.horse)setRide(true);
  if(pl&&pl.cp){lvl.enemies=lvl.enemies.filter(e=>{const ex=(e.bx!=null?e.bx:e.x)/T;return ex<pl.cp-4||ex>pl.cp+10;});hero.inv=90;}
  cam=clampCam(hero.x-VW*0.35);flagY=2*T+6;
}
function updateHero(){
  const h=hero;
  if(h.ride){h.x+=h.ride.dx;h.y+=h.ride.dy;}
  const dir=(K.r?1:0)-(K.l?1:0);const ice=lvl.theme==='zima'&&h.ground;
  if(dir){h.vx+=dir*(ice?0.22:h.ground?0.5:0.35);h.face=dir;}
  else{h.vx*=ice?0.965:h.ground?0.74:0.93;if(Math.abs(h.vx)<0.05)h.vx=0;}
  const mv=P().horse?5.4:MAXV;h.vx=Math.max(-mv,Math.min(mv,h.vx));
  if(K.jp){h.buf=8;K.jp=false;}else if(h.buf>0)h.buf--;
  if(h.ground)h.coy=6;else if(h.coy>0)h.coy--;
  if(h.buf>0&&h.coy>0){h.vy=P().horse?-15:JUMP;h.buf=0;h.coy=0;h.jumping=true;h.ground=false;h.ride=null;sfx('jump');}
  if(h.jumping&&!K.j&&h.vy<-3.5){h.vy=-3.5;h.jumping=false;}
  if(h.vy>=0)h.jumping=false;
  h.vy=Math.min(h.vy+GRAV,13);

  h.x+=h.vx;if(h.x<0){h.x=0;h.vx=0;}
  if(collideX(h))h.vx=0;
  const prevBottom=h.y+h.h;
  h.y+=h.vy;h.ground=false;h.ride=null;
  collideY(h,true);
  if(h.vy>=0){
    for(const m of lvl.movers){
      if(h.x+h.w>m.x+2&&h.x<m.x+m.w-2&&prevBottom<=m.y+Math.max(3,-m.dy+3)&&h.y+h.h>=m.y){
        h.y=m.y-h.h;h.vy=0;h.ground=true;h.ride=m;
      }
    }
  }
  if(h.ground)h.dist+=Math.abs(h.vx);else h.dist=0;

  if(h.y>H+40)return die();
  if(h.inv>0)h.inv--;
  if(h.inv<=0&&touchHazard(h))return hurt();

  const pl=P();
  for(const it of lvl.items){if(!it.got&&Math.abs(it.x-(h.x+h.w/2))<20&&Math.abs(it.y-(h.y+h.h/2))<24&&(pl.weapon||0)>=2){it.got=true;
    if(!pl.armor){pl.armor=true;popText(it.x,it.y-10,'Oklop!','#cfe8ff');}else if(!pl.horse){pl.horse=true;setRide(true);popText(it.x,it.y-14,'Konj!','#ffe27a');}else{addScore(500);popText(it.x,it.y-10,'+500','#ffe27a');}

function touchHazard(h){
  const x0=Math.floor(h.x/T),x1=Math.floor((h.x+h.w-0.01)/T),y0=Math.floor(h.y/T),y1=Math.floor((h.y+h.h-0.01)/T);
  const hb={x:h.x+3,y:h.y+3,w:h.w-6,h:h.h-4};
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){
    const t=tileAt(cx,cy);
    if(t===SPIKE&&ov(hb,{x:cx*T+4,y:cy*T+16,w:T-8,h:16}))return true;
    if(t===LAVA&&ov(hb,{x:cx*T,y:cy*T+10,w:T,h:22}))return true;
  }
  for(const s of lvl.saws){
    const nx=Math.max(hb.x,Math.min(s.x,hb.x+hb.w)),ny=Math.max(hb.y,Math.min(s.y,hb.y+hb.h));
    if((nx-s.x)**2+(ny-s.y)**2<(s.r-3)**2)return true;
  }
  return false;
}
function updateShots(){

    box.x+=s.vx;if(collideX(box)){s.life=0;puff(s.x,s.y,5,'#d8d2c4');continue;}
    box.y+=s.vy;box.ground=false;collideY(box,false);
    if(box.ground)box.vy=-5.5;
    s.x=box.x+4;s.y=box.y+4;s.vy=box.vy;
    if(s.y>H+20||s.x<cam-40||s.x>cam+VW+40)s.life=0;
    for(const e of lvl.enemies){if(e.dead||e.gone||!e.active)continue;
      if(ov(box,e,s.sup?-6:-2)){killEnemy(e,false);if(!s.sup){s.life=0;break;}}}
    if(s.sup&&tick%2===0)particles.push({type:'dot',x:s.x,y:s.y,vx:(Math.random()-.5),vy:(Math.random()-.5),life:16,max:16,col:Math.random()<.5?'#ffd75e':'#ff7ad9',r:2});

function updateEnemies(){

    if(!e.active){if(e.x<cam+VW+T*2)e.active=true;else continue;}
    e.t++;

      const px=e.x;e.x=e.bx+Math.sin(e.t*0.02)*e.amp;e.y=e.by+Math.sin(e.t*0.07)*10;e.face=e.x>px?1:-1;

const TUNES=[
  {name:'Oda radosti (Betoven)',n:[[659,.22],[659,.22],[698,.22],[784,.22],[784,.22],[698,.22],[659,.22],[587,.22],[523,.22],[523,.22],[587,.22],[659,.22],[659,.33],[587,.11],[587,.5]]},

  {name:'Turski marš (Mocart)',n:[[494,.12],[440,.12],[415,.12],[440,.12],[523,.36],[587,.12],[523,.12],[494,.12],[523,.12],[659,.36],[698,.12],[659,.12],[622,.12],[659,.12],[988,.12],[880,.12],[831,.12],[880,.12],[988,.12],[880,.12],[831,.12],[880,.12],[1047,.55]]}

function playMusic(){
  const tune=TUNES[(P().level)%TUNES.length];
  const total=tune.n.reduce((t,x)=>t+x[1],0);
  if(!AC||muted)return total;
  const t0=AC.currentTime+0.05;
  const note=(f,t,d,type,vol)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.setValueAtTime(vol,t+d*0.75);g.gain.exponentialRampToValueAtTime(.0001,t+d*0.98);

  let t=t0;for(const [f,d] of tune.n){if(f){note(f,t,d,'square',.055);note(f/2,t,d,'triangle',.09);}t+=d;}
  return total;

/* ---------- HUD ---------- */
const hudEls=[document.getElementById('hud0'),document.getElementById('hud1')];let hudKey='';
const shootBtn=document.getElementById('btnShoot');
function updHud(){
  if(!players){if(hudKey==='none')return;hudKey='none';shootBtn.classList.add('dim');hudEls.forEach(el=>{el.classList.remove('on','out','gone');el.querySelector('.hearts').textContent='♥♥♥';el.querySelector('.lv').textContent=cyr('Nivo 1');el.querySelector('.coin').textContent='● 0';el.querySelector('.sc').textContent='0';});return;}
  const k=players.map(p=>[p.lives,p.coins,p.score,p.level,p.done,p.weapon,p.armor,p.horse].join()).join('|')+cur+state;
  if(k===hudKey)return;hudKey=k;
  hudEls.forEach((el,i)=>el.classList.toggle('gone',!players.some(p=>p.idx===i)));
  shootBtn.classList.toggle('dim',!P().weapon);
  players.forEach((p,i)=>{const el=hudEls[p.idx];
    el.classList.toggle('on',i===cur&&state!=='over');el.classList.toggle('out',p.lives<=0);
    el.querySelector('.hearts').textContent=p.lives>0?'♥'.repeat(Math.min(p.lives,5))+(p.lives>5?'+':''):cyr('ispao');
    el.querySelector('.lv').textContent=cyr(p.done?'Kraj ★':'Nivo '+(p.level+1));
    el.querySelector('.coin').textContent=cyr('● '+p.coins+(p.weapon===2?' · Super praćka':p.weapon?' · Praćka':'')+(p.armor?' · Oklop':'')+(p.horse?' · Konj':''));
    el.querySelector('.sc').textContent=p.score;
  });
}

/* ---------- Resize ---------- */
function resize(){
  const r=stage.getBoundingClientRect();const aw=Math.max(100,r.width),ah=Math.max(100,r.height);
  VW=Math.max(11*T,Math.min(26*T,Math.round(H*aw/ah)));
  scale=Math.min(aw/VW,ah/H);dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=Math.floor(VW*scale)+'px';cv.style.height=Math.floor(H*scale)+'px';
  cv.width=Math.round(VW*scale*dpr);cv.height=Math.round(H*scale*dpr);
  if(lvl)cam=clampCam(cam);
}
new ResizeObserver(resize).observe(stage);resize();

/* ---------- Loop ---------- */
function step(){
  tick++;
  if(state!=='paused'){lvl.t++;moveThings(lvl);}
  for(const b of lvl.bumps)b.t--;lvl.bumps=lvl.bumps.filter(b=>b.t>0);
  for(const k in lvl.springs)if(--lvl.springs[k]<=0)delete lvl.springs[k];
  if(state==='play'){updateHero();if(state==='play'){updateShots();updateEnemies();}}
  else if(state==='dying'){hero.vy=Math.min(hero.vy+GRAV,13);hero.y+=hero.vy;if(++dieT>95)handleDeath();}
  else if(state==='win')updateWin();
  else if(state==='ending')updateEnding();
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;if(p.type==='coin')p.vy+=0.5;else if(p.type==='dot')p.vy+=0.12;p.life--;}
  particles=particles.filter(p=>p.life>0);
  if(hero&&(state==='play'||state==='win'))cam+=(clampCam(hero.x-VW*0.4)-cam)*0.12;
}
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000);last=now;
  while(acc>=1/60){if(state!=='paused')step();acc-=1/60;}
  render();updHud();requestAnimationFrame(frame);
}

/* ---------- Drawing ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);g.fill();}
const hash=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);};

function kHead(g,c,pf){

  g.fillStyle=c.hair;g.fillRect(-7,3,5,9);g.beginPath();g.moveTo(-3,3);g.lineTo(7,3);g.lineTo(6,5.5);g.lineTo(4,4.2);g.lineTo(2,6);g.lineTo(0,4.4);g.lineTo(-2,6);g.closePath();g.fill();
  g.fillStyle='#c9ced8';rr(g,-9,-4,18,8,4);g.fill();g.fillRect(-9,0,4,11);g.fillStyle='#9aa3b5';g.fillRect(-9,3,18,2);g.fillStyle='#c9ced8';g.fillRect(0,3,2,5);
  g.fillStyle=c.hat;g.beginPath();g.moveTo(-2,-4);g.quadraticCurveTo(-4,-13+pf,-12,-11+pf);g.quadraticCurveTo(-6,-8,-4,-4);g.fill();
}

  g.fillStyle='#8a5a2b';g.save();g.rotate(0.9);g.fillRect(-2,-2,3,14);g.fillStyle='#ffd75e';g.fillRect(-3.5,-3,6,2);g.restore();
  g.fillStyle=c.jacket;rr(g,-9,-15,18,15,3);g.fill();g.fillStyle='#ffd75e';g.fillRect(-9,-5,18,2.5);
  g.fillStyle='#fff';g.beginPath();g.moveTo(-3,-13);g.lineTo(3,-13);g.lineTo(3,-9);g.lineTo(0,-6.5);g.lineTo(-3,-9);g.fill();g.fillStyle=c.hat;g.fillRect(-.8,-12.5,1.6,5);
  g.save();g.translate(0,-28);kHead(g,c,run?Math.sin(ph*0.6)*1.5:0);g.restore();
  g.restore();
}

function drawHorse(g,ph,run,c,farLegsOnly){

  g.fillStyle=c.jacket;rr(g,-12,-41,22,9,3);g.fill();g.fillStyle='#ffd75e';g.fillRect(-12,-34,22,2);

function drawRiding(g,c,x,feetY,face,ph,run,air){
  const go=run&&!air;
  g.save();g.translate(x,feetY+(go?-Math.abs(Math.sin(ph))*2:0));g.scale(face*0.62,0.62);
  const lean=go?0.18:0.05;
  drawHorse(g,ph,go,c,true);riderBack(g,c,lean,ph,go);drawHorse(g,ph,go,c,false);riderFront(g,c,lean,ph,go);
  g.restore();
}
function drawHero(g,c,x,y,face,walk,air,hurt,weapon,armor){
  g.save();g.translate(x+11,y);if(face<0)g.scale(-1,1);
  const lg=air?3:Math.sin(walk)*4,sw=air?-4:Math.sin(walk+Math.PI)*3;
  const flap=air?-3:Math.sin(walk*0.5)*2;
  // cape
  g.fillStyle=c.jacketD;g.beginPath();g.moveTo(-6,11);g.lineTo(-13+flap,27);g.lineTo(-2,25);g.fill();
  // legs + boots
  g.fillStyle='#6b6f80';g.fillRect(-7+lg*0.5,22,6,6);g.fillRect(1-lg*0.5,22,6,6);
  g.fillStyle='#1a1a24';rr(g,-8+lg*0.5,27,8,3.5,1.5);g.fill();rr(g,0-lg*0.5,27,8,3.5,1.5);g.fill();
  // tunic with belt and crest
  g.fillStyle=c.jacket;rr(g,-9,11,18,14,3);g.fill();
  g.fillStyle='#ffd75e';g.fillRect(-9,20,18,2.5);
  g.fillStyle='#ffffff';g.beginPath();g.moveTo(-3,13);g.lineTo(3,13);g.lineTo(3,17);g.lineTo(0,19.5);g.lineTo(-3,17);g.fill();
  g.fillStyle=c.hat;g.fillRect(-0.8,13.5,1.6,5);
  if(armor){
    g.fillStyle='#ffd75e';rr(g,-8,11.5,16,9,3);g.fill();
    g.fillStyle='#fff3b0';g.fillRect(-6,12.5,5,2);
    g.fillStyle='#d99a00';g.fillRect(-0.8,12,1.6,8);
    g.fillStyle='#ffe58a';circ(g,-8,13,3.4);circ(g,8,13,3.4);
    const sp=(Date.now()/90)%40;if(sp<6){g.fillStyle='#ffffff';g.fillRect(-4+sp,13,1.6,1.6);}
  }
  // arm + item
  const ax=6+sw*0.4;
  if(weapon){
    if(weapon===2){g.fillStyle='rgba(255,122,217,'+(0.3+0.25*Math.sin(Date.now()/120))+')';circ(g,ax+3,16,7);}
    g.strokeStyle=weapon===2?'#ffc62b':'#7a4a2a';g.lineWidth=2.2;g.beginPath();g.moveTo(ax,22);g.lineTo(ax+2,17);g.lineTo(ax,12);g.moveTo(ax+2,17);g.lineTo(ax+6,13);g.stroke();
    g.strokeStyle='#e8e2d6';g.lineWidth=1;g.beginPath();g.moveTo(ax,12);g.lineTo(ax+2,15);g.lineTo(ax+6,13);g.stroke();
  }else{
    g.fillStyle='#8a5a2b';g.fillRect(ax+2,9,2,12);
    g.fillStyle='#d5dbe7';g.fillRect(ax+2.2,-1,1.6,11);

  }
  g.fillStyle=c.jacketD;rr(g,ax-4,13,5,8,2.5);g.fill();
  g.fillStyle='#c9ced8';circ(g,ax-1.5,20,2.8);
  // face
  g.fillStyle='#f3c39b';rr(g,-7,2,14,11,4);g.fill();
  if(hurt){g.strokeStyle='#1a1a24';g.lineWidth=1.4;g.beginPath();g.moveTo(2.5,4.5);g.lineTo(6,8);g.moveTo(6,4.5);g.lineTo(2.5,8);g.stroke();}
  else{g.fillStyle='#1a1a24';g.fillRect(3,5.5,2.5,3);}
  g.fillStyle='#ff9e9e';g.globalAlpha=.6;circ(g,1.5,10,1.6);g.globalAlpha=1;
  g.fillStyle='#b5574a';g.fillRect(3,10.5,3,1.2);
  // black hair under the helmet
  g.fillStyle=c.hair;g.fillRect(-7,3,5,9);
  g.beginPath();g.moveTo(-3,3);g.lineTo(7,3);g.lineTo(6,5.5);g.lineTo(4,4.2);g.lineTo(2,6);g.lineTo(0,4.4);g.lineTo(-2,6);g.closePath();g.fill();
  // helmet
  g.fillStyle='#c9ced8';rr(g,-9,-4,18,8,4);g.fill();g.fillRect(-9,0,4,11);
  g.fillStyle='#9aa3b5';g.fillRect(-9,3,18,2);
  g.fillStyle='#e9ecf2';g.fillRect(-6,-3,6,1.5);

  g.fillStyle=c.hatD;g.beginPath();g.moveTo(-3,-5);g.quadraticCurveTo(-6,-10+pf,-10,-10+pf);g.quadraticCurveTo(-6,-8,-4,-5);g.fill();
  g.restore();
}

  }

function drawBg(th){
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,th.sky[0]);gr.addColorStop(1,th.sky[1]);
  ctx.fillStyle=gr;ctx.fillRect(0,0,VW,H);
  const wrap=(v,span)=>((v%span)+span)%span;
  const hills=(par,col,base,amp,freq)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=VW+8;x+=8){const w=x+cam*par;ctx.lineTo(x,base-amp*(0.6*Math.sin(w*freq)+0.4*Math.sin(w*freq*2.3+1)));}
    ctx.lineTo(VW,H);ctx.fill();};
  const puffy=(x,y,s,col)=>{ctx.fillStyle=col;circ(ctx,x,y,14*s);circ(ctx,x+16*s,y-8*s,18*s);circ(ctx,x+34*s,y,14*s);ctx.fillRect(x,y-2*s,34*s,14*s);};

function drawTile(t,x,y,cx,cy,th){
  switch(t){
    case TOP:
      if(lvl.theme==='nebo'){
        ctx.fillStyle=th.dirt;ctx.fillRect(x,y+8,T,T-8);
        ctx.fillStyle='#ffffff';ctx.fillRect(x,y+3,T,9);circ(ctx,x+8,y+5,5);circ(ctx,x+24,y+5,5);circ(ctx,x+16,y+4,4.5);
        ctx.fillStyle=th.topD;ctx.fillRect(x,y+12,T,3);
      }else{
        ctx.fillStyle=th.dirt;ctx.fillRect(x,y,T,T);
        ctx.fillStyle=th.dirtD;ctx.fillRect(x+6+hash(cx,cy)*16,y+18,4,3);ctx.fillRect(x+4+hash(cy,cx)*20,y+25,3,3);
        ctx.fillStyle=th.topD;ctx.fillRect(x,y+9,T,4);
        ctx.fillStyle=th.top;ctx.fillRect(x,y,T,10);
        for(let k=0;k<4;k++)circ(ctx,x+4+k*8,y+10,3.2);
        ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x,y,T,2);
      }break;
    case DIRT:
      ctx.fillStyle=th.dirt;ctx.fillRect(x,y,T,T);
      ctx.fillStyle=th.dirtD;ctx.fillRect(x+4+hash(cx,cy)*20,y+6+hash(cy,cx)*18,4,3);ctx.fillRect(x+hash(cx+3,cy)*24,y+hash(cx,cy+7)*26,3,3);
      break;
    case BRICK:
      ctx.fillStyle='#c8642f';ctx.fillRect(x,y,T,T);
      ctx.fillStyle='#7a3416';ctx.fillRect(x,y+10,T,2);ctx.fillRect(x,y+21,T,2);ctx.fillRect(x,y+30,T,2);
      ctx.fillRect(x+15,y,2,10);ctx.fillRect(x+7,y+12,2,9);ctx.fillRect(x+23,y+12,2,9);ctx.fillRect(x+15,y+23,2,7);
      ctx.fillStyle='rgba(255,220,180,.35)';ctx.fillRect(x,y,T,2);
      break;
    case CRATE:{
      ctx.fillStyle='#e0a23f';ctx.fillRect(x,y,T,T);
      ctx.strokeStyle='#8a5a1c';ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5,T-3,T-3);
      ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x+4,y+4);ctx.lineTo(x+T-4,y+T-4);ctx.moveTo(x+T-4,y+4);ctx.lineTo(x+4,y+T-4);ctx.stroke();
      const p=0.6+0.4*Math.sin(tick*0.12+cx);ctx.fillStyle=`rgba(255,240,150,${p})`;circ(ctx,x+16,y+16,5);
      ctx.fillStyle='#fff8d0';circ(ctx,x+15,y+15,1.6);
      break;}
    case USED:
      ctx.fillStyle='#8b6a4a';ctx.fillRect(x,y,T,T);
      ctx.strokeStyle='#5c4330';ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5,T-3,T-3);
      break;
    case SPIKE:
      ctx.fillStyle='#7c8597';ctx.fillRect(x,y+28,T,4);
      for(let k=0;k<3;k++){const bx=x+1+k*10.3;ctx.fillStyle='#d5dbe7';ctx.beginPath();ctx.moveTo(bx,y+28);ctx.lineTo(bx+5,y+12);ctx.lineTo(bx+10,y+28);ctx.fill();
        ctx.fillStyle='#9aa3b5';ctx.beginPath();ctx.moveTo(bx+5,y+12);ctx.lineTo(bx+10,y+28);ctx.lineTo(bx+6,y+28);ctx.fill();}
      break;
    case LAVA:
      if(tileAt(cx,cy-1)!==LAVA){
        ctx.fillStyle='#e8480f';ctx.fillRect(x,y+8,T,T-8);
        ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.moveTo(x,y+T);
        for(let k=0;k<=T;k+=4)ctx.lineTo(x+k,y+8+Math.sin((x+k)*0.15+tick*0.08)*3);
        ctx.lineTo(x+T,y+T);ctx.fill();
        ctx.fillStyle='#ffd23a';for(let k=0;k<=T;k+=4)ctx.fillRect(x+k,y+7+Math.sin((x+k)*0.15+tick*0.08)*3,4,2);
        if(hash(cx,Math.floor(tick/40))>0.7){ctx.fillStyle='#ffd23a';circ(ctx,x+16,y+6-(tick%40)/4,2.5);}
      }else{ctx.fillStyle='#c93a0c';ctx.fillRect(x,y,T,T);ctx.fillStyle='#e8480f';ctx.fillRect(x+hash(cx,cy)*20,y+8,8,6);}
      break;
    case SPR:{
      const sq=lvl.springs[cx+','+cy]?6:0;
      ctx.fillStyle='#4a4f63';ctx.fillRect(x+3,y+27,T-6,5);
      ctx.strokeStyle='#c9cfd9';ctx.lineWidth=3;ctx.beginPath();const top=y+10+sq;
      for(let k=0;k<=4;k++){const yy=top+(y+27-top)*k/4;ctx.lineTo(k%2?x+23:x+9,yy);}ctx.stroke();
      ctx.fillStyle='#e23b3b';rr(ctx,x+2,top-5,T-4,7,3);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(x+5,top-4,T-10,2);
      break;}
    case STONE:
      ctx.fillStyle=th.stone;ctx.fillRect(x,y,T,T);
      ctx.fillStyle=th.stoneHi;ctx.fillRect(x,y,T,3);ctx.fillRect(x,y,3,T);
      ctx.fillStyle=th.stoneLo;ctx.fillRect(x,y+T-3,T,3);ctx.fillRect(x+T-3,y,3,T);
      if(hash(cx,cy)>0.6){ctx.fillRect(x+8,y+10,8,2);ctx.fillRect(x+15,y+12,2,6);}
      break;
    case CLOUD:
      ctx.fillStyle='#d6ddfb';rr(ctx,x,y+6,T,T-6,8);ctx.fill();
      ctx.fillStyle='#ffffff';rr(ctx,x,y+4,T,T-10,8);ctx.fill();
      circ(ctx,x+10,y+8,8);circ(ctx,x+23,y+7,9);
      break;
  }
}

function drawEnemy(e){
  const x=e.x,y=e.y,f=e.face;
  if(e.type==='buba'){
    if(e.dead){ctx.fillStyle='#b52a2a';ell(ctx,x+12,y+e.h-3,13,4);ctx.fillStyle='#1d1d26';ell(ctx,x+12,y+e.h-1,10,2);return;}
    const lg=Math.sin(e.t*0.35)*2;ctx.strokeStyle='#1d1d26';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<3;i++){ctx.moveTo(x+6+i*6,y+15);ctx.lineTo(x+4+i*6+(i%2?lg:-lg),y+20);}ctx.stroke();
    ctx.fillStyle='#1d1d26';circ(ctx,f>0?x+21:x+3,y+12,6);
    ctx.fillStyle='#ffffff';circ(ctx,f>0?x+23:x+1,y+10,2);
    ctx.fillStyle='#e23b3b';ell(ctx,x+12,y+11,11,8.5);
    ctx.fillStyle='#1d1d26';ctx.fillRect(x+11,y+3,2,16);circ(ctx,x+7,y+9,2);circ(ctx,x+16,y+8,2);circ(ctx,x+8,y+15,1.8);circ(ctx,x+17,y+14,1.8);
    ctx.fillStyle='rgba(255,255,255,.45)';ell(ctx,x+8,y+6,3,1.6);
  }else if(e.type==='jez'){
    ctx.fillStyle='#4e3018';
    for(let i=0;i<6;i++){const a=Math.PI*(1.05+i*0.16);const bx=x+13+Math.cos(a)*11,by=y+12+Math.sin(a)*8;ctx.beginPath();ctx.moveTo(bx-4,by+2);ctx.lineTo(x+13+Math.cos(a)*18,y+12+Math.sin(a)*14);ctx.lineTo(bx+4,by+2);ctx.fill();}
    ctx.fillStyle='#7a4e2a';ell(ctx,x+13,y+13,12,8);
    ctx.fillStyle='#e8c99a';ell(ctx,f>0?x+21:x+5,y+15,6,5);
    ctx.fillStyle='#1d1d26';circ(ctx,f>0?x+27:x-1,y+15,2);circ(ctx,f>0?x+21:x+5,y+12,1.4);
    const st=Math.sin(e.t*0.3)*2;ctx.fillStyle='#3a2414';ctx.fillRect(x+6+st,y+19,4,2);ctx.fillRect(x+16-st,y+19,4,2);
  }else{
    // small dragon
    const fl=Math.sin(e.t*0.35),cx=x+13,cy=y+10,F=f>0?1:-1;
    ctx.save();ctx.translate(cx,cy);ctx.scale(F,1);
    ctx.fillStyle='#3f9a5c';ctx.beginPath();ctx.moveTo(-9,2);ctx.quadraticCurveTo(-18,2,-19,-4);ctx.quadraticCurveTo(-15,0,-8,-1);ctx.fill();
    ctx.fillStyle='#ff7a3a';ctx.beginPath();ctx.moveTo(-19,-4);ctx.lineTo(-23,-7);ctx.lineTo(-20,-1);ctx.fill();
    ctx.fillStyle='#7a3fb0';ctx.beginPath();ctx.moveTo(-4,-3);ctx.lineTo(-10,-6-fl*9);ctx.lineTo(-6,-4-fl*5);ctx.lineTo(-1,-8-fl*10);ctx.lineTo(2,-3);ctx.fill();
    ctx.fillStyle='#4cbb6a';ell(ctx,0,1,10,7);
    ctx.fillStyle='#d6f5b8';ell(ctx,1,4,6,3);
    ctx.fillStyle='#2f7a45';for(let k=-6;k<=2;k+=4){ctx.beginPath();ctx.moveTo(k-2,-5.5);ctx.lineTo(k,-9);ctx.lineTo(k+2,-5.5);ctx.fill();}
    ctx.fillStyle='#4cbb6a';ell(ctx,10,-3,6.5,5.5);ctx.fillRect(10,-2,6,4);
    ctx.fillStyle='#f6e7b8';ctx.beginPath();ctx.moveTo(7,-7);ctx.lineTo(6,-12);ctx.lineTo(9.5,-8);ctx.fill();ctx.beginPath();ctx.moveTo(11,-8);ctx.lineTo(12,-13);ctx.lineTo(13.5,-8);ctx.fill();
    ctx.fillStyle='#ffffff';circ(ctx,11,-4,2.4);ctx.fillStyle='#1d1d26';circ(ctx,11.8,-4,1.2);
    ctx.fillStyle='#1d1d26';ctx.fillRect(15,-1,1.4,1.4);
    ctx.fillStyle='#2f7a45';ctx.fillRect(-4,7,3,3);ctx.fillRect(2,7,3,3);
    if(e.t%140<16){ctx.globalAlpha=1-(e.t%140)/16;ctx.fillStyle='#e9e4f2';circ(ctx,19+(e.t%140)*0.5,-1-(e.t%140)*0.3,2.5+(e.t%140)*0.15);ctx.globalAlpha=1;}
    ctx.restore();
  }
}

  ctx.fillStyle='#c9ced8';ctx.beginPath();for(let i=0;i<20;i++){const a=i/20*Math.PI*2,r=i%2?s.r-4:s.r+2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.fill();
  ctx.fillStyle='#e9ecf2';circ(ctx,0,0,s.r-7);ctx.fillStyle='#6d7588';circ(ctx,0,0,4);ctx.fillRect(-1,-s.r+7,2,s.r*2-14);

function drawGoal(th){
  // small castle at the end of every level: walk into the gate
  const x0=lvl.goal*T,gy=12*T,w=6*T,gx=x0+w/2;
  ctx.fillStyle=th.stone;ctx.fillRect(x0+T*0.75,gy-4*T,w-T*1.5,4*T);
  for(let k=x0+T*0.75;k<x0+w-T*0.75-4;k+=16)ctx.fillRect(k,gy-4*T-10,10,10);
  ctx.fillStyle=th.stoneLo;for(let r=gy-4*T+18;r<gy;r+=22)ctx.fillRect(x0+T*0.75,r,w-T*1.5,2);
  for(const side of [0,1]){
    const tx=side?x0+w-T*1.5:x0;
    ctx.fillStyle=th.stone;ctx.fillRect(tx,gy-6*T,T*1.5,6*T);
    ctx.fillStyle=th.stoneHi;ctx.fillRect(tx,gy-6*T,T*1.5,3);
    ctx.fillStyle=th.stoneLo;ctx.fillRect(tx+T*1.5-4,gy-6*T,4,6*T);
    ctx.fillStyle=th.roof;ctx.beginPath();ctx.moveTo(tx-6,gy-6*T);ctx.lineTo(tx+T*0.75,gy-6*T-46);ctx.lineTo(tx+T*1.5+6,gy-6*T);ctx.fill();
    ctx.fillStyle='#ffd75e';rr(ctx,tx+T*0.75-7,gy-5*T+4,14,20,7);ctx.fill();
  }
  const open=hero&&hero.phase==='in';
  ctx.beginPath();ctx.moveTo(gx-24,gy);ctx.lineTo(gx-24,gy-56);ctx.arc(gx,gy-56,24,Math.PI,0);ctx.lineTo(gx+24,gy);ctx.closePath();
  ctx.fillStyle=open?'#ffe3a0':'#2a1a14';ctx.fill();
  ctx.strokeStyle=th.stoneHi;ctx.lineWidth=5;ctx.stroke();
  if(open){ctx.globalAlpha=0.35+0.25*Math.sin(tick*0.2);ctx.fillStyle='#fff3c4';circ(ctx,gx,gy-40,30);ctx.globalAlpha=1;}
}

    ctx.fillStyle='#ff7a1f';ctx.beginPath();ctx.moveTo(x+6,gy-4);ctx.quadraticCurveTo(x+8,gy-18,x+16,gy-26+f);ctx.quadraticCurveTo(x+24,gy-18,x+26,gy-4);ctx.fill();
    ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.moveTo(x+11,gy-4);ctx.quadraticCurveTo(x+12,gy-12,x+16,gy-17-f);ctx.quadraticCurveTo(x+20,gy-12,x+21,gy-4);ctx.fill();
    ctx.fillStyle='rgba(200,200,210,.5)';for(let i=0;i<3;i++){const k=(tick*0.5+i*20)%60;circ(ctx,x+16+Math.sin(k*0.1)*4,gy-30-k,3+k*0.08);}
  }else if(d.type==='sign'){
    ctx.fillStyle='#6b4a2a';ctx.fillRect(x+14,gy-44,4,44);
    ctx.font='800 11px "Rubik",sans-serif';const label=cyr('Tvrđava →');const tw=ctx.measureText(label).width;
    const L0=x+16-tw/2-8,R0=x+16+tw/2+6;
    ctx.fillStyle='#8a5a2b';ctx.beginPath();ctx.moveTo(L0,gy-49);ctx.lineTo(R0,gy-49);ctx.lineTo(R0+11,gy-37);ctx.lineTo(R0,gy-25);ctx.lineTo(L0,gy-25);ctx.closePath();ctx.fill();
    ctx.fillStyle='#c98a4a';ctx.beginPath();ctx.moveTo(L0+2,gy-47);ctx.lineTo(R0-1,gy-47);ctx.lineTo(R0+8,gy-37);ctx.lineTo(R0-1,gy-27);ctx.lineTo(L0+2,gy-27);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a2414';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+16,gy-36.5);ctx.textBaseline='alphabetic';
  }else if(d.type==='tree'){
    ctx.fillStyle='#7a4e2a';ctx.fillRect(x+12,gy-50,9,50);
    ctx.fillStyle='#2f8a2a';circ(ctx,x+16,gy-62,22);circ(ctx,x+2,gy-48,15);circ(ctx,x+30,gy-48,15);
    ctx.fillStyle='#52c043';circ(ctx,x+10,gy-68,10);circ(ctx,x+24,gy-56,8);
    ctx.fillStyle='#e23b3b';circ(ctx,x+6,gy-52,3);circ(ctx,x+26,gy-66,3);circ(ctx,x+18,gy-46,3);
  }else if(d.type==='bush'){
    ctx.fillStyle='#2f8a2a';circ(ctx,x+6,gy-8,10);circ(ctx,x+20,gy-12,13);circ(ctx,x+34,gy-8,10);
    ctx.fillStyle='#ffffff';circ(ctx,x+12,gy-14,2);circ(ctx,x+26,gy-18,2);ctx.fillStyle='#ffd75e';circ(ctx,x+12,gy-14,.9);circ(ctx,x+26,gy-18,.9);
  }else if(d.type==='water'){
    const w=d.w*T;ctx.fillStyle='#3a8fd8';ctx.fillRect(x,gy+10,w,H-gy-10);
    ctx.fillStyle='#6fc0ff';for(let k=0;k<w;k+=8)ctx.fillRect(x+k,gy+10+Math.sin((x+k)*0.2+tick*0.1)*2,6,3);
  }
}
function drawCheckpoint(){
  if(!lvl.cp)return;
  const x=lvl.cp*T+T/2;let gy=12*T;for(let cy=1;cy<ROWS;cy++){if(SOLID[lvl.g[cy][lvl.cp]]&&!SOLID[lvl.g[cy-1][lvl.cp]]){gy=cy*T;break;}}
  const on=players&&P().cp===lvl.cp;
  ctx.fillStyle='#6b4a2a';ctx.fillRect(x-2,gy-56,4,56);
  ctx.fillStyle=on?P().c.jacket:'#9aa0b5';ctx.beginPath();ctx.moveTo(x+2,gy-56);ctx.lineTo(x+24,gy-48+Math.sin(tick*0.1)*2);ctx.lineTo(x+2,gy-40);ctx.fill();
}
function drawStar(g,x,y,r,rot){
  g.save();g.translate(x,y);g.rotate(rot);
  g.fillStyle='rgba(255,122,217,.35)';circ(g,0,0,r+5);
  g.fillStyle='#ffd75e';g.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,rr2=i%2?r*0.45:r;g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}g.closePath();g.fill();
  g.fillStyle='#fff6c2';circ(g,0,0,r*0.3);g.restore();
}
function drawGift(x,y){
  ctx.fillStyle='rgba(159,211,255,'+(0.35+0.2*Math.sin(tick*0.15))+')';circ(ctx,x,y,17);
  ctx.fillStyle='#e23b6a';rr(ctx,x-11,y-7,22,18,3);ctx.fill();
  ctx.fillStyle='#ff5a85';rr(ctx,x-13,y-11,26,7,3);ctx.fill();
  ctx.fillStyle='#ffd75e';ctx.fillRect(x-2,y-11,4,22);ctx.fillRect(x-11,y,22,3);
  ctx.beginPath();ctx.ellipse(x-5,y-13,5,3.5,-0.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x+5,y-13,5,3.5,0.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff6c2';circ(ctx,x,y-12,2.2);
}
function drawPick(x,y){
  ctx.fillStyle='rgba(255,226,122,'+(0.35+0.2*Math.sin(tick*0.15))+')';circ(ctx,x,y,15);
  ctx.strokeStyle='#7a4a2a';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y+11);ctx.lineTo(x,y+1);ctx.lineTo(x-7,y-9);ctx.moveTo(x,y+1);ctx.lineTo(x+7,y-9);ctx.stroke();
  ctx.strokeStyle='#f5efe2';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x-7,y-9);ctx.lineTo(x,y-3);ctx.lineTo(x+7,y-9);ctx.stroke();ctx.lineCap='butt';
}
function drawCoin(x,y,ph){
  const w=Math.abs(Math.cos(ph))*8+1.5;
  ctx.fillStyle='#c98a00';ell(ctx,x,y,w+1.5,11.5);
  ctx.fillStyle='#ffcc2e';ell(ctx,x,y,w,10);
  ctx.fillStyle='#fff1a8';ell(ctx,x-w*0.3,y-2,w*0.3,5);
}

function render(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(state==='ending'){drawEnding(ctx,VW,H,endT,P().c,fw,P().weapon);return;}
  const th=THEMES[lvl.theme];
  drawBg(th);
  const c=Math.round(cam);
  ctx.save();ctx.translate(-c,0);
  drawGoal(th);drawCheckpoint();
  for(const d of lvl.deco)drawDeco(d);
  const x0=Math.max(0,Math.floor(c/T)),x1=Math.min(lvl.w-1,Math.floor((c+VW)/T)+1);
  for(let cy=0;cy<ROWS;cy++)for(let cx=x0;cx<=x1;cx++){
    const t=lvl.g[cy][cx];if(!t)continue;
    let off=0;for(const b of lvl.bumps)if(b.cx===cx&&b.cy===cy)off=Math.sin((10-b.t)/10*Math.PI)*7;
    drawTile(t,cx*T,cy*T-off,cx,cy,th);
  }
  for(const m of lvl.movers)drawMover(m,th);
  for(const s of lvl.saws)drawSaw(s);
  for(const co of lvl.coins)if(!co.got&&co.x>c-20&&co.x<c+VW+20)drawCoin(co.x,co.y,tick*0.08+co.x*0.01);
  for(const it of lvl.items)if(!it.got){const by=it.y+Math.sin(tick*0.08)*4;if(players&&(P().weapon||0)>=2)drawGift(it.x,by);else drawPick(it.x,by);}
  for(const s of lvl.shots){if(s.sup){drawStar(ctx,s.x,s.y,8,tick*0.3);}else{ctx.fillStyle='#6d6458';circ(ctx,s.x,s.y,4.5);ctx.fillStyle='#b8ad9c';circ(ctx,s.x-1.2,s.y-1.2,2);}}
  for(const e of lvl.enemies)if(!e.gone&&e.x>c-40&&e.x<c+VW+40&&(!e.dead||e.squish))drawEnemy(e);
  if(state==='title'){
    drawHero(ctx,HEROES[0],4*T,12*T-30-Math.abs(Math.sin(tick*0.06))*6,1,0,false,false);
    drawHero(ctx,HEROES[1],6*T,12*T-30-Math.abs(Math.sin(tick*0.06+1.4))*6,-1,0,false,false);
  }else if(hero&&!hero.hidden&&players){
    const h=hero;const air=!h.ground&&state==='play';
    if(state==='dying'){ctx.save();ctx.translate(h.x+11,h.y+15);ctx.rotate(Math.min(dieT*0.06,Math.PI));drawHero(ctx,P().c,-11,-15,h.face,0,true,true);ctx.restore();}
    else if(!(h.inv>0&&tick%6<3)){if(P().horse)drawRiding(ctx,P().c,h.x+h.w/2,h.y+h.h,h.face,tick*0.35,Math.abs(h.vx)>0.4||state==='win',air);else drawHero(ctx,P().c,h.x,h.y,h.face,h.dist*0.18,air||h.phase==='slide',false,P().weapon,P().armor);}
  }
  for(const p of particles){
    const a=Math.max(0,p.life/p.max);
    if(p.type==='horse'){ctx.globalAlpha=Math.min(1,a*1.5);ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.face*0.62,0.62);drawHorse(ctx,tick*0.4,true,p.c,true);drawHorse(ctx,tick*0.4,true,p.c,false);ctx.restore();ctx.globalAlpha=1;}
    else if(p.type==='dot'){ctx.globalAlpha=a;ctx.fillStyle=p.col;circ(ctx,p.x,p.y,p.r);ctx.globalAlpha=1;}
    else if(p.type==='coin')drawCoin(p.x,p.y,tick*0.4);
    else{ctx.globalAlpha=Math.min(1,a*2);ctx.font='800 16px "Rubik",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(20,24,51,.85)';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;}
  }
  ctx.restore();
  // level name chip
  if(state==='play'&&lvl.t<150||state==='card'){
    ctx.globalAlpha=state==='card'?0:Math.min(1,(150-lvl.t)/30);
    ctx.font='800 18px "Rubik",sans-serif';ctx.textAlign='left';const txt=cyr(lvl.name);const w=ctx.measureText(txt).width+24;
    ctx.fillStyle='rgba(19,24,51,.75)';rr(ctx,12,12,w,30,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(txt,24,33);ctx.globalAlpha=1;
  }
}

showTitle();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
